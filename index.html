/* 🩹 v6.56 — ARREGLO DEL CHAT EN LA APK (lo cazó Rey, y era culpa mía): al apartar Apex del
   notch le puse al panel del chat "alto automático", así que crecía con su contenido, su
   cabecera se salía por arriba y los ajustes se derramaban por encima. Lo correcto es que
   el panel ocupe TODO el hueco ya apartado — ni más ni menos. */
html.es-apk .ia-ov,html.es-apk .menu-ov{box-sizing:border-box}
html.es-apk .ia-panel{height:100%;max-height:100%;min-height:0}

/* 🧍 ROBERTO SUELTO — sin círculo, sin borde, sin fondo: es ÉL, de cuerpo entero, flotando
   en tu pantalla (Rey, 31-08: "lo quiero a cuerpo completo, no encerrado en un círculo").
   La sombra propia lo despega del fondo sea cual sea la sección. */
.fab.rob-cuerpo{width:82px;height:148px;padding:0;font-size:0;overflow:visible;
  background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.65)) drop-shadow(0 0 16px rgba(240,201,92,.22))}
.fab.rob-cuerpo .rob-yo{position:absolute;inset:0;border-radius:0;overflow:visible}
.fab.rob-cuerpo:active{transform:scale(.95)}
.fab.rob-cuerpo.dragging{transform:scale(1.05);box-shadow:none!important;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.7)) drop-shadow(0 0 22px rgba(240,201,92,.45))}
.fab.rob-cuerpo.alerta{animation:robLatirFab .8s ease-in-out infinite!important;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.65)) drop-shadow(0 0 20px rgba(255,90,90,.75))}
/* 🟢 v7.59 — DESPUÉS DEL ROJO, EL VERDE. Rey: "poner también la verde cuando todo pase y
   haya pasado el peligro". El rojo avisaba del peligro pero nada decía cuándo había pasado:
   Rey tenía que deducirlo de que el rojo YA NO ESTABA, y lo que no está no se ve. Ahora, al
   salir de un estado urgente, se pone verde unos segundos y vuelve a su dorado. */
.fab.rob-cuerpo.despejado{animation:robDespeja 1.5s ease-in-out 2!important;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.65)) drop-shadow(0 0 22px rgba(49,196,106,.8))}
@keyframes robDespeja{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes robLatirFab{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.rob-globo{animation:none}
html.rob-anim-min .fab.rob-cuerpo.alerta{animation:none!important}
/* el suelito bajo sus pies: lo asienta en la pantalla sin encerrarlo */
.fab.rob-cuerpo::after{content:"";position:absolute;left:18%;right:18%;bottom:2px;height:9px;
  border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent 72%);pointer-events:none}
/* 🫧 su nubecita: aparece a su lado y se va sola */
/* 💬 v6.78 — NUBECITA DE CÓMIC, no un rectángulo (Rey, 01-09, con imágenes de
   referencia). Más pequeña (190 px en vez de 250), más redonda, y con el RABITO y su
   bolita apuntando hacia él, como en un tebeo. Ocupa mucha menos pantalla. */
/* 🔋 v6.94 — el aviso de que Android puede dormir a Apex: tiene que verse, porque su
   consecuencia es quedarse sin alarmas toda una madrugada sin enterarse. */
.aviso-rojo{background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.5);border-radius:10px;
  padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.45;color:var(--fg)}
.aviso-rojo b{color:#ff8a8a}
/* 🎈 v7.87 — EL RABITO SIGUE A ROBERTO, Y LA NUBE NACE DE SU BOCA.
   Rey (10-09): «todavía hay nubes saliendo por detrás y por delante de Roberto… hay nubes que
   salen cortadas todavía… dale un diseño más realista y bonito».
   LAS DOS CAUSAS, y las dos eran de verdad:
   (1) el rabito estaba CLAVADO a 12 px del borde de la nube (`.der::before{right:12px}`),
       pero la nube SÍ se mueve: `robGloboSitio` recorta su posición para que no se salga de
       la pantalla. Cuando eso pasaba, la nube se deslizaba y el rabito se quedaba atrás —
       apuntando al vacío por un lado, o cayéndole encima por el otro. Eso es lo que él vio
       como «por detrás y por delante».
   (2) el rebotito crecía desde el CENTRO y se pasa de tamaño (1.06). Junto al borde de la
       pantalla, ese sobrante es justo lo que se veía «cortado».
   AHORA: `--rabo` lleva la X EXACTA de su boca dentro de la nube (la calcula el JS después de
   recortar), las dos bolitas se centran ahí, y la nube CRECE DESDE ESE PUNTO — como si le
   saliera de la boca de verdad. Lo que Rey ya había pedido antes se respeta entero: bordes
   dorados definidos, la esquina de abajo viva, y dos bolitas que menguan hacia él. */
.rob-globo{position:fixed;z-index:61;max-width:min(46vw,162px);color:var(--fg);
  overflow-wrap:break-word;
  background:linear-gradient(180deg,#232a52 0%,var(--card) 62%,#171d3c 100%);
  border:1.5px solid var(--gold);border-radius:16px 16px 16px 6px;padding:7px 10px;font-size:12px;line-height:1.3;
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset, 0 2px 6px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.5);
  opacity:0;transform:translateY(6px) scale(.9);
  transform-origin:var(--rabo,50%) 100%;
  transition:opacity .2s,transform .2s;pointer-events:auto;cursor:pointer}
/* el rabito y su bolita: se centran en --rabo, que es donde está su boca de verdad */
.rob-globo::before,.rob-globo::after{content:"";position:absolute;
  background:linear-gradient(180deg,var(--card) 0%,#171d3c 100%);
  border:1.5px solid var(--gold);border-radius:50%;pointer-events:none;
  box-shadow:0 2px 5px rgba(0,0,0,.35)}
.rob-globo::before{width:8px;height:8px;bottom:-5px;left:var(--rabo,12px);margin-left:-4px}
.rob-globo::after{width:5px;height:5px;bottom:-12px;left:var(--rabo,5px);margin-left:-2.5px}
/* si por lo que sea no llegara --rabo, se cae al comportamiento de siempre y no se rompe nada */
.rob-globo.der:not([style*="--rabo"])::before{left:auto;right:12px;margin-left:0}
.rob-globo.der:not([style*="--rabo"])::after{left:auto;right:5px;margin-left:0}
/* 🎈 v6.81 — si Roberto está arriba del todo, la nubecita va DEBAJO de él y el rabito
   se da la vuelta para seguir saliendo de su boca (antes apuntaba al techo). */
.rob-globo.abajo::before{bottom:auto;top:-5px}
.rob-globo.abajo::after{bottom:auto;top:-12px}
/* si la nube va DEBAJO de él, nace por arriba: el origen del rebotito se da la vuelta */
.rob-globo.abajo{transform-origin:var(--rabo,50%) 0%}
.rob-globo.izq:not([style*="--rabo"])::before{left:12px}
.rob-globo.izq:not([style*="--rabo"])::after{left:5px}
/* al salir, un rebotito de cómic */
.rob-globo.ver{animation:robGloboPop .34s cubic-bezier(.34,1.56,.64,1) both}
@keyframes robGloboPop{0%{opacity:0;transform:translateY(8px) scale(.8)}60%{transform:translateY(0) scale(1.06)}100%{opacity:1;transform:none}}
.rob-globo.ver{opacity:1;transform:none}
/* el nombre solo se pone en los avisos urgentes: en la charla normal sobra, él está ahí */
.rob-globo b{color:var(--gold);display:block;font-size:11px;letter-spacing:.3px;margin-bottom:1px}
.rob-globo.urge{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,90,90,.3),0 10px 30px rgba(0,0,0,.55)}
/* 🟢 v7.59 — y su nubecita en verde cuando el peligro pasó */
.rob-globo.ok{border-color:var(--green);box-shadow:0 0 0 2px rgba(49,196,106,.3),0 10px 30px rgba(0,0,0,.55)}
.rob-globo.ok b{color:var(--green)}
@media (prefers-reduced-motion:reduce){html:not(.rob-anim-on) .fab.rob-cuerpo.alerta{animation:none!important}}

/* ===== MENÚ DESPLEGABLE DE SECCIONES ===== */
/* ═══════════════════════════════════════════════════════════════════════════════
   🗂️ v7.284 — EL MENÚ DE LA ORILLA. Antes era una rejilla que caía desde arriba con
   las 19 secciones seguidas, sin jerarquía: para llegar a «Mentor» había que leerse
   las diecinueve. Ahora se desliza desde la izquierda y va agrupado por cómo se usa
   el día. El activo se marca con una rayita del acento, no con un bloque de color:
   un bloque compite con el verde y el rojo del dinero, una rayita no.
   ═══════════════════════════════════════════════════════════════════════════════ */
.menu-ov{position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;transition:opacity .22s}
.menu-ov.show{opacity:1;visibility:visible}
.menu-sheet{position:fixed;top:0;left:0;bottom:0;width:306px;max-width:86vw;
  background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(-102%);transition:transform .26s cubic-bezier(.22,.9,.3,1);
  box-shadow:28px 0 60px -30px rgba(0,0,0,.9)}
.menu-ov.show .menu-sheet{transform:none}

/* la marca */
.menu-h{display:flex;align-items:center;gap:11px;flex-shrink:0;padding:calc(16px + var(--safe-t)) 14px 14px}
.menu-mark{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--acc),var(--acc-2));color:var(--on-acc);
  font-weight:800;font-size:19px;letter-spacing:-.04em;box-shadow:0 10px 24px -12px var(--acc)}
.menu-h .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-transform:none;letter-spacing:0}
.menu-h .t b{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--txt)}
.menu-h .t small{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.menu-h .x{width:34px;height:34px;border-radius:10px;background:var(--card);color:var(--txt2);font-size:15px;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--line);flex-shrink:0}

/* Roberto, el primero y el único con cara */
.menu-rob{display:flex;align-items:center;gap:11px;width:100%;margin:0 0 4px;padding:10px 11px;border-radius:13px;
  text-align:left;border:1px solid rgb(var(--acc-rgb)/.4);
  background:linear-gradient(135deg,rgb(var(--acc-rgb)/.12),transparent 70%),var(--card)}
.menu-rob:active{background:linear-gradient(135deg,rgb(var(--acc-rgb)/.2),transparent 60%),var(--card2)}
.menu-rob-av{position:relative;width:34px;height:34px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:var(--card3);border:1px solid var(--line2)}
.menu-rob-av img{width:140%;height:140%;object-fit:cover;object-position:50% 12%;margin:-5px 0 0 -20%;display:block}
.menu-rob-av i{position:absolute;right:0;bottom:1px;width:10px;height:10px;border-radius:50%;
  background:var(--green);border:2px solid var(--bg2);z-index:2}
.menu-rob-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.menu-rob-t b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--txt)}
.menu-rob-t small{font-size:11px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* el ojo: quita y trae su cuerpo pequeño sin salir del menú */
.menu-ojo{width:32px;height:32px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);background:var(--bg2)}   /* var, no negro: en modo claro un rgba(0,0,0,.25) sería un cuadro oscuro */
.menu-ojo svg{width:15px;height:15px;stroke-width:1.9;color:var(--txt3)}
.menu-ojo.on svg{color:var(--acc)}

.menu-grid{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 10px 10px;display:block}
.menu-grid::-webkit-scrollbar{width:4px}
.menu-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.menu-g{padding:15px 10px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--txt3)}
.menu-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:42px;
  padding:8px 10px;border-radius:11px;background:transparent;border:0;text-align:left}
.menu-item:active{background:rgba(255,255,255,.05)}
.menu-item.on{background:rgba(255,255,255,.065)}
.menu-item.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:2.5px;border-radius:3px;background:var(--acc)}
.menu-item .mi-ic{width:18px;height:18px;flex-shrink:0;font-size:0;line-height:0;color:var(--txt3)}
.menu-item .mi-ic svg{width:18px;height:18px;stroke-width:1.8;display:block}
.menu-item.on .mi-ic{color:var(--acc)}
.menu-item .mi-t{font-size:14.5px;font-weight:500;color:var(--txt2);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item.on .mi-t{color:var(--txt);font-weight:650}
.mi-help{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  border:1px solid var(--line2);color:var(--txt3);font-weight:700;font-size:12px;
  background:transparent;display:flex;align-items:center;justify-content:center;line-height:1}
.mi-help:active{background:var(--card3);color:var(--acc);transform:scale(.9)}

/* 🎨 v7.284 — EL COLOR, EN EL PIE DEL MENÚ. Estaba en la cabecera y no cabía (visto en
   su teléfono: tapaba «APEX · TRADING DESK»). Aquí caben las tres muestras a la vez y se
   cambia de UN TOQUE, sin ventana de por medio — mejor de lo que era. */
.menu-col{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:8px;
  border-radius:12px;border:1px solid var(--line);background:var(--card)}
.menu-col-k{flex:1;min-width:0;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-col-b{width:30px;height:30px;flex-shrink:0;border-radius:9px;border:2px solid transparent;
  padding:0;position:relative}
.menu-col-b i{position:absolute;inset:2px;border-radius:6px;display:block}
.menu-col-b.on{border-color:var(--txt)}
.menu-col-b:active{transform:scale(.9)}

/* el pie: quién eres y qué versión llevas */
.menu-pie{flex-shrink:0;padding:10px;border-top:1px solid var(--line)}
.menu-yo{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  border:1px solid var(--line);background:var(--card)}
.menu-yo-av{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;letter-spacing:-.02em;
  background:rgb(var(--acc-rgb)/.12);color:var(--acc);border:1px solid rgb(var(--acc-rgb)/.4)}
.menu-yo-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.menu-yo-t b{font-size:13px;font-weight:650;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-yo-t small{font-size:11px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* en pantalla ancha (su PC) el menú se queda fijo: con ratón no hay pulgar que
   alcance una orilla, y esconder la navegación detrás de un botón sobra */
@media(min-width:1000px){
  .menu-ov{background:none;backdrop-filter:none;opacity:1;visibility:visible;pointer-events:none;width:306px}
  .menu-sheet{transform:none;box-shadow:none;pointer-events:auto}
  .menu-h .x{display:none}
  body{padding-left:306px}
  .fab,.rob-globo{margin-left:153px}
}
.ia-ov{position:fixed;inset:0;z-index:210;background:rgba(6,10,20,.6);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center}
.ia-ov.show{opacity:1;visibility:visible}
.ia-panel{background:var(--bg);border:none;border-top:3px solid var(--gold);
  border-radius:0;width:100%;max-width:640px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  transform:translateY(30px);transition:transform .24s cubic-bezier(.2,1,.4,1)}
@media (min-width:641px){.ia-panel{height:96vh;height:96dvh;border-radius:16px;border:1px solid var(--line);border-top:3px solid var(--gold)}}
.ia-ov.show .ia-panel{transform:none}
.ia-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.ia-title{font-weight:700;font-size:17px;color:var(--gold);display:flex;align-items:center;gap:9px}
.ia-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
/* ✏️ v6.46 — LA CARA DE ROBERTO (su carita mini vive en el encabezado del chat) */
.ia-rob{width:46px;height:46px;flex:0 0 46px;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,#1b2a5e,#0d1330);border:2px solid var(--gold);cursor:pointer;
  box-shadow:0 0 12px rgba(240,201,92,.35)}
.ia-rob:active{transform:scale(.94)}
.ia-rob-viva{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;
  background:var(--green);border:2px solid var(--card);box-shadow:0 0 8px var(--green)}
.ia-title-txt{display:flex;flex-direction:column;line-height:1.15}
.ia-title-txt small{font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:.2px}
.ia-head-btns{display:flex;gap:6px}
.ia-ic{width:38px;height:38px;border-radius:10px;background:var(--card2);color:var(--txt2);font-size:15px;display:flex;align-items:center;justify-content:center}
.ia-cfg{padding:14px 16px 28px;border-bottom:1px solid var(--line);background:var(--card);flex-shrink:0;max-height:76vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ia-cfg-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ia-mini{width:auto;padding:8px 13px;font-size:13px;margin:0}
.ia-chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--txt2);margin:7px 0;cursor:pointer}
.ia-chk input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0}
.ia-conv-list{display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto}
.ia-conv{display:flex;align-items:stretch;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:11px;overflow:hidden;flex-shrink:0}
.ia-conv.act{border-color:var(--gold)}
.ia-conv-b{flex:1;padding:11px 13px;min-width:0}
.ia-conv-t{color:var(--txt);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ia-conv-d{color:var(--txt3);font-size:11.5px;margin-top:3px}
.ia-conv-x{width:40px;flex-shrink:0;background:transparent;border:none;border-left:1px solid var(--line);color:var(--txt3);font-size:15px}
.ia-conv-x:active{background:var(--card3)}
/* 🗂️ Carpetas y marcadores de chats (fijar/importante/revisar) */
.ia-conv-fold{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.9;margin:12px 2px 3px}
.ia-conv-list > .ia-conv-fold:first-child{margin-top:2px}
/* 🗂️ v6.42 — CARPETAS PLEGABLES de conversaciones: cada categoría es una carpeta con contador.
   v6.44 (Rey: "se ve feo, los títulos ni se leen"): las filas ya NO se encogen (flex-shrink:0
   — el flex con scroll las aplastaba y cortaba el texto) y cada carpeta abierta tiene su
   CUERPO indentado con borde dorado: se ve QUÉ vive dentro de qué carpeta. */
.ia-carp{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:10px 11px;color:var(--gold);font-size:12.5px;font-weight:700;letter-spacing:.03em;cursor:pointer;user-select:none;flex-shrink:0}
.ia-carp:active{background:var(--card3)}
.ia-carp-fl{color:var(--txt3);font-weight:400}
.ia-carp-body{display:flex;flex-direction:column;gap:7px;margin:-2px 0 4px 9px;padding-left:9px;border-left:2px solid var(--line);flex-shrink:0}
.ia-conv-flags{display:flex;align-items:stretch;flex-shrink:0;border-left:1px solid var(--line)}
.ia-conv-flags .ia-conv-x{border-left:none}
.ia-flag{width:30px;align-self:stretch;background:transparent;border:none;font-size:13.5px;opacity:.3;filter:grayscale(1);cursor:pointer}
.ia-flag.on{opacity:1;filter:none}
.ia-flag:active{background:var(--card3)}
.ia-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.ia-msg{max-width:86%;padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere}
.ia-msg.user{align-self:flex-end;background:var(--gold);color:var(--on-acc);border-bottom-right-radius:5px;font-weight:500}
.ia-msg.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-bottom-left-radius:5px}
.ia-speak{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:20px;background:var(--card3);border:1px solid var(--line);color:var(--txt2)}
.ia-speak:active{transform:scale(.95)}
.ia-speak.on{border-color:var(--gold);color:var(--gold)}
/* 🗑️ borrar un mensaje suelto (v7.133). Va discreto y a un lado: tiene que estar cuando hace
   falta, sin invitar a tocarlo por error — y aun así pregunta antes de borrar nada. */
.ia-del{display:inline-flex;align-items:center;justify-content:center;margin-top:9px;margin-left:6px;
  width:30px;height:30px;font-size:13px;line-height:1;border-radius:50%;
  background:transparent;border:1px solid var(--line);color:var(--txt2);opacity:.45;vertical-align:middle}
.ia-del:active{transform:scale(.9);opacity:1}
.ia-msg.user .ia-del{margin-top:6px}
.ia-link{color:var(--gold);text-decoration:underline;word-break:break-all}
.ia-welcome{text-align:center;margin:auto;padding:20px;color:var(--txt2)}
.ia-w-emoji{font-size:44px;margin-bottom:10px}
.ia-w-t{font-size:19px;font-weight:700;color:var(--txt);margin-bottom:6px}
.ia-w-s{font-size:14px;line-height:1.5;max-width:40ch;margin:0 auto}
.ia-wait{align-self:flex-start;font-size:11.5px;color:var(--txt3);margin:-4px 0 2px 4px;max-width:86%;line-height:1.4}
.ia-typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--txt3);margin:0 2px;animation:iablink 1s infinite}
.ia-typing span:nth-child(2){animation-delay:.2s}.ia-typing span:nth-child(3){animation-delay:.4s}
@keyframes iablink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.ia-quick{display:flex;gap:8px;padding:8px 14px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.ia-quick::-webkit-scrollbar{display:none}
/* 🗂️ v6.30: fila de categorías de chips (encima de la tira de chips) */
.ia-cats{display:flex;gap:6px;padding:8px 14px 0;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.ia-cats::-webkit-scrollbar{display:none}
.ia-cat{white-space:nowrap;font-size:11.5px;padding:5px 11px;border-radius:14px;background:transparent;border:1px solid var(--line);color:var(--txt3);flex-shrink:0}
.ia-cat.on{background:var(--card2);color:var(--gold);border-color:var(--gold-dim);font-weight:600}
.ia-chip{white-space:nowrap;font-size:12.5px;padding:8px 13px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--txt2);flex-shrink:0}
.ia-msg-img{display:block;max-width:100%;width:auto;max-height:340px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line)}
.ia-msg.user .ia-msg-img{margin-left:auto}
.ia-att{padding:8px 14px 0;flex-shrink:0}
.ia-att-wrap{position:relative;display:inline-block}
.ia-att-img{max-height:96px;max-width:150px;border-radius:10px;border:1px solid var(--line);display:block}
.ia-att-x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--card3);border:1px solid var(--line);color:var(--txt);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.ia-attbtn{width:42px;height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--txt2);font-size:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ia-attbtn:active{transform:scale(.93);background:var(--card3)}
.ia-input{display:flex;gap:8px;padding:12px 14px calc(12px + var(--safe-b));border-top:1px solid var(--line);flex-shrink:0;align-items:flex-end}
.ia-input textarea{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px 14px;font-size:16px;resize:none;max-height:120px;font-family:inherit;line-height:1.4}
.ia-input textarea:focus{outline:none;border-color:var(--gold)}
.ia-send{width:46px;height:46px;border-radius:12px;background:var(--gold);color:var(--on-acc);font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ia-send:active{transform:scale(.93)}
.ia-send:disabled{opacity:.5}
/* Micrófono grabando */
.ia-attbtn.rec{background:var(--red);border-color:var(--red);color:#fff;animation:micpulse 1s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,122,.55)}50%{box-shadow:0 0 0 8px rgba(255,107,122,0)}}
/* ---- Sección 📰 Noticias (calendario) ---- */
.nt-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nt-htxt{flex:1 1 160px;min-width:0}
.nt-tt{font-weight:800;font-size:18px;color:var(--gold-soft)}
.nt-sub{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.35}
.nt-ff{width:auto;flex:0 0 auto;display:inline-flex;align-items:center;padding:10px 14px;font-size:13.5px;white-space:nowrap}
.nt-filtro{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.nt-lb{display:block;font-size:13px;color:var(--txt2);margin-bottom:8px}
.nt-row{display:flex;gap:8px;align-items:stretch}
.nt-row .inp{flex:1 1 auto;min-width:0}
.nt-row .btn{width:auto;flex:0 0 auto;white-space:nowrap;padding:0 20px;display:flex;align-items:center;justify-content:center}
.nt-hint{font-size:11.5px;color:var(--txt2);margin-top:7px;line-height:1.4}
.nt-load{padding:20px 4px;text-align:center;color:var(--txt2)}
.nt-ok .t{font-weight:800;color:var(--green);font-size:16px}
.nt-ok .s{color:var(--txt2);font-size:13px;margin-top:4px;line-height:1.45}
.nt-day{font-weight:800;font-size:13px;letter-spacing:.5px;color:var(--gold);margin-bottom:10px}
.nt-ev{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.nt-ev:first-of-type{border-top:none}
.nt-ev-l{display:flex;flex-direction:column;align-items:center;gap:4px;width:52px;flex-shrink:0}
.nt-dot{width:9px;height:9px;border-radius:50%;margin-top:4px}
.nt-ev.alto .nt-dot{background:var(--red);box-shadow:0 0 6px var(--red)}
.nt-ev.medio .nt-dot{background:#F0A868}
.nt-hh{font-size:12px;font-weight:700;color:var(--txt)}
.nt-ev-t{font-weight:600;font-size:14px;line-height:1.3}
.nt-ev-s{font-size:12px;color:var(--txt2);margin-top:3px}
/* ---- Parte del día + veredicto ---- */
.brief{background:linear-gradient(180deg,rgb(var(--acc-rgb)/.10),var(--card));border:1px solid var(--gold-soft)}
.brief-h{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:16px;color:var(--gold-soft);margin-bottom:10px}
.brief-d{font-size:12px;color:var(--txt2);font-weight:600;text-transform:capitalize}
.brief-row{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--txt);padding:4px 0;line-height:1.35}
.brief-ic{width:22px;text-align:center;flex-shrink:0}
.verdict{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.verdict.ok{background:rgba(55,208,141,.10);border-color:rgba(55,208,141,.45)}
.verdict.no{background:rgba(255,107,122,.10);border-color:rgba(255,107,122,.45)}
.verdict-t{font-weight:800;font-size:15px;margin-bottom:7px}
.verdict.ok .verdict-t{color:var(--green)}
.verdict.no .verdict-t{color:var(--red)}
.verdict-l{font-size:13px;color:var(--txt);padding:3px 0;line-height:1.35}
/* ---- ⏰ Avisos ---- */
.modal-t{font-weight:800;font-size:18px;color:var(--gold-soft);margin-bottom:12px}
.av{transition:opacity .2s;cursor:pointer}
.av:active{background:var(--card2)}
.av-off{opacity:.5}
.av-top{display:flex;align-items:center;gap:10px}
.av-hora{font-weight:800;font-size:18px;color:var(--gold);flex-shrink:0;font-variant-numeric:tabular-nums}
.av-tit{font-weight:700;font-size:15px;flex:1;min-width:0;line-height:1.25}
.av-sw{width:46px;height:27px;border-radius:14px;background:var(--card3);border:1px solid var(--line);flex-shrink:0;position:relative;transition:background .18s}
.av-sw span{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--txt2);transition:transform .18s,background .18s}
.av-sw.on{background:var(--gold)}
.av-sw.on span{transform:translateX(19px);background:var(--on-acc)}
.av-msg{font-size:13px;color:var(--txt2);margin-top:9px;line-height:1.4}
.av-foot{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.av-tag{font-size:11px;color:var(--txt2);background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.av-tag.fuerte{color:var(--gold-soft);border-color:var(--gold-soft)}
.av-actions{margin-left:auto;display:flex;gap:8px}
.av-btn{width:auto;margin-top:0;padding:9px 14px;font-size:13px}
.av-btn.del{padding:9px 12px;background:rgba(255,107,122,.10);border-color:rgba(255,107,122,.4);color:var(--red)}
/* ---- Tarjeta de confirmación de acciones de Roberto ---- */
.ia-tool{background:linear-gradient(180deg,rgba(107,138,255,.12),var(--card2));border:1px solid var(--blue);border-radius:14px;padding:13px 15px;margin:8px 0;animation:fi .2s}
/* 🎫 v7.201 — la tarjeta del CEREBRO. Mismo cuerpo que la de manos para que se lea igual,
   pero en dorado en vez de azul: no es una acción sobre su sistema, es una decisión de GASTO.
   Lleva clase propia (sin .ia-tool) a propósito: la maquinaria de las manos busca .ia-tool y
   si la compartiera, el toque desde su cuerpo flotante acabaría en el sitio equivocado. */
.ia-cerebro{background:linear-gradient(180deg,rgba(232,185,95,.13),var(--card2));border:1px solid var(--gold);border-radius:14px;padding:13px 15px;margin:8px 0;animation:fi .2s}
.ia-cerebro .ia-tool-h{color:var(--gold)}
.ia-tool-h{font-weight:800;font-size:14px;color:var(--blue);margin-bottom:8px}
.ia-tool-d{font-size:14px;color:var(--txt);line-height:1.45;white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ia-tool-bar{display:flex;gap:9px;margin-top:11px}
.ia-tool-bar .btn{margin-top:0;flex:1;padding:12px}
.ia-tool-done{color:var(--green);font-weight:700;font-size:14px}
.ia-tool-cancel{color:var(--red);font-weight:700;font-size:14px}
/* ---- Selector de días (chips) ---- */
.dias-row{display:flex;gap:6px;flex-wrap:wrap}
.dia-chip{flex:1;min-width:40px;padding:10px 4px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--txt2);font-size:13px;font-weight:700}
.dia-chip.on{background:var(--gold);color:var(--on-acc);border-color:var(--gold)}
.dia-chip:active{transform:scale(.94)}
/* ---- Banner del vigilante de Roberto ---- */
.rob-banner{position:fixed;left:10px;right:10px;top:calc(10px + var(--safe-t));z-index:300;display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:14px;background:linear-gradient(180deg,#2A2140,#1A1530);border:1px solid var(--gold-soft);box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateY(-140%);opacity:0;transition:transform .28s,opacity .28s;cursor:pointer}
.rob-banner.show{transform:none;opacity:1}
.rob-ic{font-size:20px;flex-shrink:0;line-height:1.3}
.rob-tx{flex:1;font-size:13.5px;color:var(--txt);line-height:1.4;font-weight:500}
.rob-x{flex-shrink:0;background:none;color:var(--txt2);font-size:16px;padding:0 2px;line-height:1}
/* ---- Historial de Roberto ---- */
.hist-box{max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hist-row{padding:9px 0;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:none}
.hist-f{font-size:11px;color:var(--txt2);font-variant-numeric:tabular-nums;margin-bottom:2px}
.hist-t{font-size:13.5px;color:var(--txt);line-height:1.4}
/* ===== Respuestas VIVAS de Roberto (markdown enriquecido) ===== */
.ia-msg.bot{max-width:94%}
.ia-md>*:first-child{margin-top:0}
.ia-md>*:last-child{margin-bottom:0}
.ia-md p{margin:9px 0}
.ia-md-h{font-weight:700;color:var(--gold);margin:14px 0 7px;line-height:1.25;text-wrap:balance}
.ia-md-h.h1{font-size:17.5px}
.ia-md-h.h2{font-size:15.5px}
/* 🗂️ Memoria de Roberto en carpetas plegables (vista Mi memoria) */
.ia-mem-fold{border:1px solid rgba(255,255,255,.10);border-radius:12px;margin:7px 0;background:rgba(255,255,255,.03);overflow:hidden}
.ia-mem-fold summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;color:var(--gold);font-size:14px;user-select:none}
.ia-mem-fold summary::-webkit-details-marker{display:none}
.ia-mem-fold summary::after{content:"▾";margin-left:auto;opacity:.6;transition:transform .18s}
.ia-mem-fold:not([open]) summary::after{transform:rotate(-90deg)}
.ia-mem-fold[open] summary{border-bottom:1px solid rgba(255,255,255,.08)}
.ia-mem-n{background:rgba(255,255,255,.12);border-radius:9px;padding:1px 8px;font-size:11.5px;color:#fff;font-weight:700}
.ia-mem-fold ul{margin:8px 0 10px;padding:0 14px 0 28px}
.ia-mem-fold li{margin:7px 0;line-height:1.45;font-size:13.5px}
.ia-mem-ayuda{opacity:.65;font-size:12px;margin:2px 0 8px}
.ia-mem-pie{opacity:.65;font-size:12px;font-style:italic;margin-top:10px}
.ia-md-h.h3{font-size:14.5px;color:var(--txt)}
.ia-md ul,.ia-md ol{margin:8px 0;padding-left:20px}
.ia-md li{margin:5px 0}
.ia-md li::marker{color:var(--gold)}
.ia-md blockquote{margin:11px 0;padding:9px 13px;border-left:3px solid var(--gold);background:var(--card3);border-radius:0 9px 9px 0;color:var(--txt)}
.ia-md code{background:var(--card3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px;font-family:ui-monospace,"Cascadia Code","Consolas",monospace}
.ia-md hr{border:0;border-top:1px solid var(--line);margin:13px 0}
.ia-md-tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:11px 0;border:1px solid var(--line);border-radius:10px}
.ia-md table{border-collapse:collapse;width:100%;font-size:13px}
.ia-md th,.ia-md td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
.ia-md th:last-child,.ia-md td:last-child{border-right:none}
.ia-md tbody tr:last-child td{border-bottom:none}
.ia-md th{background:var(--card3);color:var(--gold);font-weight:700;white-space:nowrap;position:sticky;top:0}
.ia-md tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.ia-md b{color:var(--txt);font-weight:700}

/* ===== 🎯 VISTA HOY — todo el día en una pantalla ===== */
.hoy-top{text-align:center}
/* v7.286 — la fecha ya no vive dentro de una tarjeta: es la etiqueta de la fila de
   numeros, asi que va pequena, en mayusculas y pegada a ellos. */
.hoy-fecha{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--txt3);margin:2px 2px 9px}
.hoy-horas{font-size:20px;font-weight:800;color:var(--txt);margin:5px 0 11px;line-height:1.35}
.hoy-horas span{font-size:11.5px;font-weight:600;color:var(--txt3);letter-spacing:.4px;text-transform:uppercase}
.hoy-pill{display:inline-block;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid}
.hoy-pill.ok{background:rgba(55,208,141,.12);border-color:rgba(55,208,141,.42);color:var(--green)}
.hoy-pill.warn{background:rgba(245,166,91,.12);border-color:rgba(245,166,91,.42);color:var(--orange)}
.hoy-pill.bad{background:rgba(255,107,122,.10);border-color:rgba(255,107,122,.38);color:var(--red)}
.hoy-row{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:9px}
.hoy-row.warn{border-color:rgba(245,166,91,.45)}
.hoy-row.bad{border-color:rgba(255,107,122,.5);background:rgba(255,107,122,.06)}
.hoy-row-t{font-size:14.5px;font-weight:700;color:var(--txt)}
.hoy-row-d{font-size:12.5px;color:var(--txt2);margin-top:3px}
.hoy-row-a{font-size:12.5px;color:var(--orange);margin-top:5px;font-weight:600}
.hoy-row.bad .hoy-row-a{color:var(--red)}
.hoy-ctx{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  font-size:11.5px;line-height:1.5;color:var(--txt2);white-space:pre-wrap;word-break:break-word;
  max-height:230px;overflow:auto;margin:0 0 4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.note.ok{color:var(--green)} .note.bad{color:var(--red)}

/* ===== 🧭 VISTA ARRANQUE — el plan, vivo ===== */
.arr-top{text-align:center}
.arr-eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.arr-fase{font-size:21px;font-weight:800;color:var(--txt);margin:7px 0 2px;line-height:1.2}
.arr-cuando{font-size:12.5px;color:var(--txt3);margin-bottom:15px}
.arr-mapa{display:flex;align-items:center;justify-content:center;gap:0}
.arr-mapa i{flex:0 0 16px;height:2px;background:var(--line);display:block}
.arr-dot{width:31px;height:31px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;border:2px solid var(--line);color:var(--txt3);background:var(--card2);flex:0 0 auto}
.arr-dot.done{background:var(--green-dim);border-color:var(--green);color:#fff}
.arr-dot.now{background:var(--gold);border-color:var(--gold);color:var(--on-acc);transform:scale(1.16)}
.arr-card.cerrada{opacity:.5}
.arr-card.hecha{border-color:rgba(55,208,141,.32)}
.arr-card.activa{border-color:var(--gold);box-shadow:0 0 0 1px rgb(var(--acc-rgb)/.18)}
.arr-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.arr-h h2{margin:0;font-size:17px;flex:1;min-width:120px}
.arr-n{font-size:19px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.arr-badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--txt3);background:var(--card2);white-space:nowrap}
.arr-badge.activa{background:var(--gold);border-color:var(--gold);color:var(--on-acc)}
.arr-badge.hecha{background:rgba(55,208,141,.14);border-color:rgba(55,208,141,.4);color:var(--green)}
.arr-idea{font-size:13px;color:var(--txt2);margin:0 0 13px;line-height:1.5}
.arr-pasos{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.arr-paso{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--card2);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt2);font-size:13.5px;
  font-family:inherit;line-height:1.45;cursor:pointer}
.arr-paso .box{flex:0 0 18px;height:18px;border-radius:5px;border:2px solid var(--line2,var(--line));margin-top:1px}
.arr-paso.on{color:var(--txt);border-color:rgba(55,208,141,.38);background:rgba(55,208,141,.06)}
.arr-paso.on .box{background:var(--green);border-color:var(--green);position:relative}
.arr-paso.on .box::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#04220F;font-size:12px;font-weight:900}
.arr-paso[disabled]{opacity:.6;cursor:default}
.arr-señal{background:var(--card2);border-left:3px solid var(--gold);border-radius:0 11px 11px 0;
  padding:12px 14px;margin:13px 0}
.arr-señal.ok{border-left-color:var(--green);background:rgba(55,208,141,.07)}
.arr-señal .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);margin-bottom:6px}
.arr-señal.ok .lbl{color:var(--green)}
.arr-señal p{margin:0 0 5px;font-size:13px;color:var(--txt2);line-height:1.5}
.arr-señal p.est{font-weight:700;color:var(--txt)}
.arr-señal p.falta{color:var(--orange);font-size:12.5px;margin:0}
.arr-bloq{font-size:12.5px;color:var(--txt3);background:var(--card2);border:1px dashed var(--line);
  border-radius:11px;padding:12px 14px;text-align:center}

/* Chip del destino de un aviso: a dónde te lleva al tocarlo */
.av-tag.ir{background:rgb(var(--acc-rgb)/.12);border-color:rgb(var(--acc-rgb)/.4);color:var(--gold)}

/* 🆘 Botones de recuperación dentro de un mensaje de Roberto */
.ia-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ia-acc-b{font:inherit;font-size:13.5px;font-weight:600;padding:10px 14px;border-radius:11px;
  background:var(--card3);border:1px solid var(--line);color:var(--txt);cursor:pointer;line-height:1.2}
.ia-acc-b:active{transform:scale(.97)}
.ia-acc-b.gold{background:var(--gold);border-color:var(--gold);color:var(--on-acc)}

/* ═══════════════════════════════════════════════════════════════════════════════
   ⚙️ v7.286 — LOS COMPONENTES DE AJUSTES. Son los del rediseño: etiqueta pequeña,
   dato grande, control a la derecha, icono de línea. Se usan aquí primero y luego
   en el resto de Apex.
   ═══════════════════════════════════════════════════════════════════════════════ */
.aj-g{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--txt3);margin:22px 2px 9px}
.aj-g:first-child{margin-top:4px}
.aj-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:18px;overflow:hidden;margin-bottom:12px;
  box-shadow:0 20px 44px -30px rgba(0,0,0,.95)}
.aj-row{display:flex;align-items:center;gap:13px;width:100%;padding:14px 15px;
  border-bottom:1px solid var(--line);text-align:left;background:none;min-height:60px}
.aj-card > .aj-row:last-child{border-bottom:0}
.aj-row:active{background:rgba(255,255,255,.04)}
.aj-ic{width:20px;height:20px;flex-shrink:0;color:var(--txt3);line-height:0}
.aj-ic svg{width:20px;height:20px;stroke-width:1.8;display:block}
.aj-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.aj-t b{font-size:14.5px;font-weight:600;color:var(--txt);letter-spacing:-.01em}
.aj-t small{font-size:12px;line-height:1.45;color:var(--txt3)}
.aj-t small b{font-size:12px;color:var(--txt2);font-weight:700}
.aj-val{font-size:13.5px;font-weight:700;color:var(--gold);flex-shrink:0;letter-spacing:-.01em}
.aj-chev{width:16px;height:16px;flex-shrink:0;color:var(--txt3);line-height:0}
.aj-chev svg{width:16px;height:16px;stroke-width:2.2;display:block}

/* el interruptor: grande de verdad, que se acierte con el pulgar */
.aj-sw{width:50px;height:29px;flex-shrink:0;border-radius:999px;position:relative;
  border:1px solid var(--line2);background:rgba(0,0,0,.3);transition:background .18s,border-color .18s}
.aj-sw i{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;
  background:var(--txt3);transition:transform .18s,background .18s;display:block}
.aj-sw.on{background:rgb(var(--acc-rgb)/.18);border-color:rgb(var(--acc-rgb)/.5)}
.aj-sw.on i{transform:translateX(21px);background:var(--gold)}
html[data-tema="claro"] .aj-sw{background:rgba(16,16,20,.08)}

/* el segmentado: claro / oscuro, y cualquier otro par */
.aj-seg{display:flex;gap:5px;flex-shrink:0;padding:4px;border-radius:12px;
  background:rgba(0,0,0,.3);border:1px solid var(--line)}
html[data-tema="claro"] .aj-seg{background:rgba(16,16,20,.05)}
.aj-seg button{font:inherit;font-size:12.5px;font-weight:650;padding:7px 12px;border-radius:9px;
  color:var(--txt3);background:none;border:0;white-space:nowrap}
.aj-seg button.on{background:var(--card3);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}

/* las tres muestras de color */
.aj-cols{display:flex;gap:9px;flex-shrink:0}
.aj-col{width:34px;height:34px;border-radius:11px;border:2px solid transparent;padding:0;position:relative}
.aj-col i{position:absolute;inset:2px;border-radius:7px;display:block}
.aj-col.on{border-color:var(--txt)}
.aj-col:active{transform:scale(.9)}

/* la hora, editable en su sitio */
.aj-hora{font:inherit;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:-.01em;
  background:var(--card3);border:1px solid var(--line2);border-radius:10px;
  padding:8px 10px;flex-shrink:0;min-height:40px}
.aj-hora:focus{outline:none;border-color:var(--gold)}

/* la nota de un grupo: por qué existe, en una línea */
.aj-nota{font-size:12.5px;line-height:1.6;color:var(--txt3);margin:-4px 2px 14px;padding:0 2px}
.aj-nota b{color:var(--txt2)}

/* las exigencias quitadas, para devolverlas */
.aj-tags{display:flex;flex-wrap:wrap;gap:7px;padding:0 15px 14px}
.aj-tag{font:inherit;font-size:12px;font-weight:650;padding:7px 12px;border-radius:999px;
  border:1px dashed var(--line2);background:transparent;color:var(--txt3)}
.aj-tag:active{border-style:solid;color:var(--gold);border-color:var(--gold)}

/* ✕ Cancelar la espera cuando Roberto se queda pensando de más */
.ia-cancel-w{display:flex;justify-content:flex-start;margin:-4px 0 8px}
.ia-cancel{font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:10px;
  background:transparent;border:1px solid var(--line);color:var(--txt3);cursor:pointer}
.ia-cancel:active{background:var(--card2);color:var(--txt)}

/* 🎨 v7.284 — LAS MUESTRAS DE COLOR. Se ven los tres a la vez y el elegido lleva marco:
   elegir un color leyendo su nombre no sirve de nada, hay que VERLO. */
.col-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:4px 0 2px}
.col-b{display:grid;gap:9px;justify-items:center;padding:14px 6px;border-radius:14px;
  background:var(--card2);border:1px solid var(--line);color:var(--txt2);
  font-size:12.5px;font-weight:700;cursor:pointer}
.col-b .col-m{width:38px;height:38px;border-radius:12px;box-shadow:0 8px 18px -8px rgba(0,0,0,.9)}
.col-b.on{border-color:var(--acc);background:rgb(var(--acc-rgb)/.10);color:var(--txt)}
.col-b.on .col-m{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc)}
.col-n{margin:12px 0 0;font-size:12.5px;line-height:1.6;color:var(--txt3)}
.col-n b{color:var(--txt2)}
</style>
</head>
<body>

<!-- 🎬 v6.53 — LA ENTRADA DE APEX, LO PRIMERO DE TODO (Rey, 31-08: "se abre primero la
     pantalla de Apex, después se quita en segundos y DESPUÉS es que sale la animación").
     Tenía razón: antes la montaba el código, y para entonces la página ya se había pintado.
     Ahora está aquí, en la primera línea del cuerpo, y la decisión de mostrarla se toma
     ARRIBA DEL TODO (en la cabecera) para que no se vea nada de Apex antes de tiempo.
     Sin la APK esto está oculto y el código lo borra: la web abre exactamente igual. -->
<div id="apexIntro" aria-hidden="true">
  <!-- 🎬 v6.93 — la MISMA imagen del icono (Rey: "la animación debe ser con la imagen del
       icono con fondo oscuro"). Antes había aquí una A dibujada en vectores, distinta de la
       del escritorio, y Apex parecía dos aplicaciones. -->
  <div class="marca">
    <img src="marca-apex.png" alt="" aria-hidden="true">
    <div class="destello"></div>
  </div>
  <div class="nombre">APEX</div>
  <div class="lema">TRADING DESK · REY</div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="crtGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="var(--acc-2)"/><stop offset=".5" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc-3)"/>
  </linearGradient>
  <symbol id="crtLogo" viewBox="0 0 100 100">
    <rect x="20" y="20" width="60" height="60" rx="15" transform="rotate(45 50 50)"
          fill="rgb(var(--acc-rgb)/.06)" stroke="url(#crtGold)" stroke-width="3.4"/>
    <g fill="url(#crtGold)">
      <rect x="35.4" y="52" width="7.2" height="15" rx="2.4"/>
      <rect x="46.4" y="44" width="7.2" height="16" rx="2.4"/>
      <rect x="57.4" y="36" width="7.2" height="17" rx="2.4"/>
    </g>
    <g stroke="url(#crtGold)" stroke-width="2.4" stroke-linecap="round">
      <line x1="39" y1="44" x2="39" y2="70"/>
      <line x1="50" y1="36" x2="50" y2="64"/>
      <line x1="61" y1="30" x2="61" y2="58"/>
    </g>
  </symbol>
</defs></svg>

<div class="wrap">

  <div class="hdr">
    <button class="hdr-ic" id="btnMenu" aria-label="Menú de secciones">☰</button>
    <div class="hdr-center">
      <div class="hdr-logo"><svg viewBox="0 0 100 100"><use href="#crtLogo"/></svg></div>
      <div>
        <div class="hdr-t">APEX</div>
        <div class="hdr-s">Trading desk · Rey</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="hdr-ic" id="btnTema" aria-label="Cambiar tema claro/oscuro">🌗</button>
      <button class="hdr-ic hdr-help" id="btnAyuda" aria-label="¿Para qué sirve esta pantalla?">?</button>
    </div>
  </div>

  <div class="clocks">
    <div class="clock">
      <div class="clock-l">Nueva York</div>
      <div class="clock-v" id="cNY">--:--</div>
      <div class="clock-d" id="dNY">—</div>
    </div>
    <div class="clock">
