<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roberto flotando</title>
<!--
  🫧 ROBERTO SOBRE LAS DEMÁS APLICACIONES  (paso 2 del plan de Rey)
  ---------------------------------------------------------------------------
  Esta página NO es una pantalla de Apex: es lo que Android dibuja ENCIMA de
  cualquier otra aplicación, dentro de una ventana flotante. Por eso el fondo
  es transparente y no hay nada más que Roberto.

  LO IMPORTANTE: usa EL MISMO roberto.js que Apex. No hay un "Roberto de la
  burbuja" distinto — es el mismo ser, los mismos 34 gestos, la misma cara.
  Regla sellada por Rey: "Roberto y su cuerpo son UNO SOLO".

  Android le habla llamando a estas funciones:
     burbujaGesto("celebra")            → cambia de gesto
     burbujaDecir("texto", "gesto")     → saca la nubecita y mueve la boca
     burbujaCallar()                    → cierra la nubecita
     burbujaLado("izq" | "der")         → se coloca según el borde donde esté
  Y ella le contesta por la consola (Android lee esos mensajes).
-->
<style>
  /* ⚠️ EL FALLO DEL 31-08 ESTABA AQUÍ (Rey: "sigue siendo una foto", tres veces).
     El parte que mandó la burbuja lo cantó: vivo:true, cy:-152 = -(150+2).
     Roberto SÍ se dibujaba… 152 px por encima del borde. ¿Por qué? El body llevaba
     height:100% pero el <html> NO tenía altura, así que el body medía CERO de alto y
     un "bottom:2px" lanzaba a Roberto hacia arriba, fuera de la ventana.
     Dos seguros para que no vuelva a pasar:
       1) html y body con altura de verdad;
       2) todo colocado con position:FIXED y en unidades de la ventana (vh), que se
          miden contra la ventana misma y no contra el body. Así da igual lo que le
          pase al body: Roberto siempre cae donde se ve. */
  html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden;
            -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{width:100%;min-height:100%;position:relative;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  /* Medidas en vh: la ventana solo se ensancha para la nubecita, nunca cambia de alto,
     así que Roberto conserva su tamaño y no depende de píxeles ni de la densidad del
     teléfono (en el moto g54 un píxel de la página era un píxel de pantalla y Roberto
     salía a un tercio de su tamaño). 0.571 es su proporción real (264/462). */
  /* 📏 v7.20 — LA UNIDAD CONGELADA, Y POR QUÉ HIZO FALTA.
     Rey (03-09, con foto): "mira cómo corta la nube, y creo que la nube es fija, no
     adaptativa al mensaje; la nube debe adaptarse al mensaje sin romperse, lo más natural
     posible… no un parche pegado que entra y sale genéricamente".
     TENÍA RAZÓN Y LA CAUSA ERA DE RAÍZ: la ventana flotante medía 231 puntos de ALTO SIEMPRE
     —solo cambiaba de ancho, y de dos maneras: estrecha o ancha—, mientras que la nubecita
     crece hacia ARRIBA desde la boca de Roberto. Con tres líneas cabía raspando; con cuatro
     se salía por el techo de la VENTANA y Android la cortaba. No la cortaba el CSS: la
     cortaba el marco. Por eso se veía como un recorte pegado.
     PARA QUE LA VENTANA PUEDA CRECER hay que resolver antes una trampa: aquí todo se medía
     en `vh`, que es un porcentaje de la ALTURA DE LA VENTANA. Si la ventana crece, `vh`
     crece — y Roberto se haría gigante cada vez que dijera algo largo.
     Así que la unidad se CONGELA al arrancar: `--u` vale lo que valía 1vh con la ventana en
     su tamaño de reposo, y ya no se mueve. A partir de ahí la ventana puede crecer lo que
     necesite la frase sin que Roberto ni su nubecita cambien un pelo de tamaño.
     El valor de aquí abajo es solo el de emergencia (si el guion no llegara a correr, todo
     se comporta como antes en vez de quedarse en blanco). */
  /* 📐 v7.60 — su ventana pasó a 176×264 dp para que quepa su sombra sin cortarse. Su cuerpo
     NO cambia de tamaño: 82vh de 264 dp son los mismos 217 dp que antes eran 94vh de 231. */
  :root{ --u:1vh; --globo-max:52vw;
         /* 📐 v7.61 — UN SOLO SITIO PARA CADA MEDIDA. La v7.60 metió el cuerpo hacia dentro
            para que cupiera su sombra, pero la nubecita y el pulso siguieron anclados al
            sitio de antes y se le montaban encima. Ahora todo lo que se coloca al lado de
            Roberto suma este mismo --rob-borde: si un día cambia, cambian todos a la vez. */
         --rob-hh:0.82; --rob-alto:calc(82 * var(--u));
         --rob-ancho:calc(calc(82 * var(--u)) * 0.571);
         --rob-borde:calc(10 * var(--u));
         /* lo que ocupa Roberto contado desde el borde de la pantalla: su cuerpo + su margen */
         --rob-hueco:calc(var(--rob-ancho) + var(--rob-borde)); }

  /* 🧍 el cuerpo: pegado al borde donde Rey lo haya dejado */
  /* 🧍 v7.59 — Y SE MUEVE DE LADO COMO EL DE DENTRO. Antes tenía transition:none y cambiaba
     de borde DE GOLPE; el de dentro de Apex se desplaza y da un empujoncito de escala.
     Rey lo vio: "la forma de moverse hacia los lados". Solo se anima el desplazamiento
     lateral — nunca el alto ni el ancho, que eso sí daría tirones. */
  /* 🗂️ v7.78 — EL ORDEN DE LAS CAPAS, que hasta ahora no lo mandaba nadie.
     Rey (08-09), con la foto delante: «la nube sale por detrás de Roberto; hay dos, una
     sale por delante y otra por detrás de él».
     LA CAUSA: en la página, #globo está escrito ANTES que #robCuerpo y ninguno tenía capa
     asignada. Con dos elementos `position:fixed` sin z-index, CSS los apila por el ORDEN
     DEL DOCUMENTO — así que el cuerpo SIEMPRE se dibujaba encima de la nube.
     No se notaba porque la nubecita normal sale al lado y no le pisa. Pero el panel del
     VISTAZO (#globo.repaso) ocupa el ancho entero y se metía debajo de él: su sombrero y su
     cara tapaban el texto, que es justo lo que Rey fotografió.
     Ahora manda la capa y no el orden: el suelo abajo, el cuerpo encima, y lo que TIENE
     ALGO QUE DECIR siempre delante — porque si no se lee, no sirve. */
  #robSombra{z-index:1}
  #pulso{z-index:2}
  #robCuerpo{position:fixed;bottom:calc(9 * var(--u));width:var(--rob-ancho);height:var(--rob-alto);
             z-index:3;
             transition:left .26s cubic-bezier(.34,1.2,.64,1), right .26s cubic-bezier(.34,1.2,.64,1)}
  /* 🌑 v7.60 — SU SOMBRA EN EL SUELO, debajo y no rodeándole. Rey: "falta la sombra de abajo,
     y la sombra es alrededor del cuerpo y debajo no". Es lo que de verdad asienta a un
     personaje: sin ella parece un recorte pegado a la pantalla.
     Y RESPIRA con él: al flotar hacia arriba se encoge y se aclara, como pasa de verdad. */
  #robSombra{position:fixed;bottom:calc(3.5 * var(--u));width:calc(var(--rob-ancho) * 0.52);
             height:calc(3.2 * var(--u));border-radius:50%;
             background:radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,.30) 45%, rgba(0,0,0,0) 72%);
             pointer-events:none; animation:robSombraRespira 3.6s ease-in-out infinite}
  body[data-lado="der"] #robSombra{right:calc(var(--rob-borde) + var(--rob-ancho) * 0.24)}
  body[data-lado="izq"] #robSombra{left:calc(var(--rob-borde) + var(--rob-ancho) * 0.24)}
  @keyframes robSombraRespira{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.86);opacity:.62}}
  #robCuerpo.cambiando{animation:robPaso .3s ease-in-out}
  @keyframes robPaso{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  /* 📐 v7.60 — separado del borde de SU ventana para que la sombra tenga sitio a los dos
     lados. Su ventana sigue pegada al borde de la pantalla: lo que se aparta es él dentro. */
  body[data-lado="der"] #robCuerpo{right:var(--rob-borde)}
  body[data-lado="izq"] #robCuerpo{left:var(--rob-borde)}
  /* que se despegue del fondo de cualquier app, clara u oscura */
  /* 🌑 v7.59 — LA MISMA SOMBRA Y EL MISMO HALO QUE DENTRO DE APEX.
     Dentro: drop-shadow(0 6px 12px rgba(0,0,0,.65)) sobre un cuerpo de 148 px → 4% y 8%.
     Aquí el cuerpo mide 94vh, así que 4% y 8% son 3.8vh y 7.6vh. Las medidas no se copian
     a lo bruto (allí son píxeles, aquí vh): se copia la PROPORCIÓN. */
  /* 🌑 v7.60 — la sombra propia sigue la FORMA de su cuerpo (drop-shadow respeta la silueta),
     y el halo dorado baja a 5vh: con 26 dp de margen cabe entero y ya no se corta en cuadrado.
     La sombra del SUELO va aparte, en #robSombra, porque esa es la que él pidió. */
  #robCuerpo .rob-svg{filter:drop-shadow(0 calc(2.6 * var(--u)) calc(5 * var(--u)) rgba(0,0,0,.5))
                             drop-shadow(0 0 calc(5 * var(--u)) rgba(240,201,92,.2))}
  /* ✋🔔 v7.59 — EL LATIDO ROJO CON UNA ALERTA, que aquí fuera NO EXISTÍA. Dentro de Apex el
     cuerpo late y se pone el halo rojo cuando el gesto es urgente (alerta y frena). Fuera,
     que es donde Rey lo tiene delante todo el día, no pasaba nada de nada. */
  #robCuerpo.urge .rob-svg{filter:drop-shadow(0 calc(2.6 * var(--u)) calc(5 * var(--u)) rgba(0,0,0,.5))
                                  drop-shadow(0 0 calc(6.5 * var(--u)) rgba(255,90,90,.8))}
  #robCuerpo.urge{animation:robLatir .8s ease-in-out infinite}
  @keyframes robLatir{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  /* 🟢 v7.59 — DESPUÉS DEL ROJO, EL VERDE, también aquí fuera (que es donde Rey lo tiene
     delante todo el día). Al salir de un estado urgente: verde unos segundos y a su dorado. */
  #robCuerpo.despejado .rob-svg{filter:drop-shadow(0 calc(2.6 * var(--u)) calc(5 * var(--u)) rgba(0,0,0,.5))
                                       drop-shadow(0 0 calc(6.5 * var(--u)) rgba(49,196,106,.8))}
  #robCuerpo.despejado{animation:robDespeja 1.5s ease-in-out 2}
  @keyframes robDespeja{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  #globo.ok{border-color:#31c46a; box-shadow:0 0 0 calc(1.6 * var(--u)) rgba(49,196,106,.3), 0 8px 24px rgba(0,0,0,.55)}
  #globo.ok b{color:#5fe08c}

  /* 💬 la nubecita: SIEMPRE al lado contrario del cuerpo, para no taparlo */
  /* 💬 LA NUBECITA — v7.13, CALCADA A LA DE DENTRO DE APEX
     ─────────────────────────────────────────────────────────────────────────────────
     Rey (02-09), con las dos delante en una captura: "la del de afuera es fea, debe quedar
     EXACTAMENTE igual que la de adentro: los bordes definidos, redondeados, los circulitos
     del rabito a la medida de la cabeza apuntando a la boca, no a los pies".
     Tenía toda la razón. Aquí había un pico triangular a la altura de los PIES y unas
     esquinas redondeadas por igual; dentro de Apex hay una esquina viva abajo (la que
     "sale" de él), DOS BOLITAS por rabito, y sale a la altura de su BOCA.
     ⚠️ ESTA ES LA COPIA, Y EL ORIGINAL ES `.rob-globo` DE index.html. No se pueden
     compartir literalmente porque viven en mundos distintos —allí son píxeles de página y
     aquí vh de una ventana de 132 dp—, pero el ASPECTO debe ser el mismo. Hay un banco
     (`test-nube-igual`) que compara las dos y salta si se separan: sin él, esto se vuelve
     la quinta lista de caras del proyecto.
     ───────────────────────────────────────────────────────────────────────────────── */
  /* 📏 v7.20 — `border-box` para que el tope de ancho signifique LO QUE MIDE LA NUBECITA
     ENTERA, con su borde y su relleno dentro. Sin esto el tope se refería solo al texto y
     la nubecita acababa 33 px más ancha de lo que se había calculado — justo lo suficiente
     para no caber en la pantalla junto al cuerpo. */
  #globo{position:fixed;max-width:var(--globo-max);box-sizing:border-box;display:none;
         z-index:4;   /* 🗂️ v7.78 — SIEMPRE DELANTE del cuerpo: lo que dice se tiene que leer */
         overflow-wrap:break-word;
         /* 🎈 v7.87 — el MISMO acabado que la de dentro de Apex: un degradado suave en vez de
            un color plano, un filo de luz arriba y la sombra en dos capas. Rey lo pidio asi:
            "dale un diseno mas realista y bonito". La forma, el borde dorado y la esquina viva
            no se tocan: eso ya lo habia decidido el antes. */
         background:linear-gradient(180deg,#232a52 0%,#1B2145 62%,#171d3c 100%);color:#f4efe2;
         /* el rebotito nace del rabito, no del centro: junto al borde de la ventana era el
            sobrante del rebote lo que se veia CORTADO */
         transform-origin:50% 100%;
         border:calc(0.9 * var(--u)) solid #f0c95c;
         /* la esquina de abajo VIVA, del lado por el que sale: igual que dentro de Apex */
         border-radius:calc(9 * var(--u)) calc(9 * var(--u)) calc(9 * var(--u)) calc(3.5 * var(--u));
         padding:calc(3.5 * var(--u)) calc(5 * var(--u));font-size:calc(7.2 * var(--u));line-height:1.28;font-weight:600;
         box-shadow:0 1px 0 rgba(255,255,255,.07) inset, 0 2px 6px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.5)}
  /* el rebotito sale del lado por el que esta Roberto, no del centro */
  body[data-lado="der"] #globo{transform-origin:88% 100%}
  body[data-lado="izq"] #globo{transform-origin:12% 100%}
  /* 🔴 v7.59 — LA NUBECITA URGENTE, calcada de `.rob-globo.urge` de index.html: borde rojo
     y su anillo. Aquí fuera no existía, así que un "NO ENTRES" salía con el mismo borde
     dorado que un "buenos días" — que es justo lo contrario de lo que hace falta. */
  #globo.urge{border-color:#ff5a5a; box-shadow:0 0 0 calc(1.6 * var(--u)) rgba(255,90,90,.3), 0 8px 24px rgba(0,0,0,.55)}
  #globo.urge b{color:#ff8a8a}
  /* 🎈 A LA ALTURA DE SU BOCA, NO DE SUS PIES. Su cuerpo mide 94vh desde 1vh del suelo, y
     la boca le cae al 47% de arriba — o sea a ~51vh del suelo. El rabito CUELGA de la nube
     y baja 7,5vh, así que la nube se pone a 58vh: la bolita pequeña muere justo en su boca.
     (Con 51vh el rabito le quedaba por el pecho — se ve, y se ve mal.) */
  /* 🩹 v7.61 — +var(--rob-borde): sin esto la nube empezaba 10 unidades más adentro de donde
     empieza Roberto y se le montaba encima del cuerpo. */
  body[data-lado="der"] #globo{right:calc(var(--rob-hueco) + calc(2 * var(--u))); bottom:calc(58 * var(--u))}
  body[data-lado="izq"] #globo{left:calc(var(--rob-hueco) + calc(2 * var(--u)));  bottom:calc(58 * var(--u))}
  /* 📋 v7.67 — EL REPASO DEL DÍA NO ES UNA FRASE HABLADA, Y NO SE PINTA IGUAL.
     Rey (06-09, con la foto): la nubecita del vistazo le salía como una COLUMNA de 50 renglones
     que le tapaba la pantalla entera. Se midió: la letra de la nubecita son 54 píxeles —está
     pensada para leer de una ojeada una frase corta— y al lado de Roberto solo quedan ~300 de
     ancho: dentro caben CUATRO LETRAS por renglón, y el repaso son tres líneas de cuarenta.
     El repaso es un PANEL, no un globo de habla: va como una tira a lo ancho, con letra más
     pequeña, y respetando sus tres renglones. Así cabe sin ensanchar nada. */
  #globo.repaso{left:calc(2 * var(--u)) !important; right:calc(2 * var(--u)) !important;
                max-width:none; font-size:calc(3.2 * var(--u)); line-height:1.42;
                white-space:pre-line; text-align:left;
                padding:calc(2.6 * var(--u)) calc(3.2 * var(--u))}
  #globo.hay{display:block; animation:robGloboPop .34s cubic-bezier(.34,1.56,.64,1) both}
  /* 🤏 v7.25 — plan B: si la ventana no creció a tiempo, la nubecita se pone ENCIMA del
     cuerpo en vez de quedarse fuera de la ventana (donde solo se veía su borde: la raya) */
  body.apretada #globo{left:calc(2 * var(--u)) !important; right:calc(2 * var(--u)) !important}
  #globo b{color:#f0c95c;display:block;font-size:calc(6 * var(--u));letter-spacing:.3px;margin-bottom:calc(.4 * var(--u))}
  /* ✅ v7.25 — LOS DOS BOTONES DE LA TARJETA. Grandes a propósito: Rey los toca con el
     pulgar, de pie, mirando otra cosa. Los mismos colores que la tarjeta de dentro de Apex
     para que sea la MISMA tarjeta, no una parecida. */
  #tarj{display:flex;gap:calc(2 * var(--u));margin-top:calc(3 * var(--u))}
  #tarj span{flex:1;text-align:center;padding:calc(2.6 * var(--u)) 0;border-radius:calc(4 * var(--u));
    font-size:calc(6.4 * var(--u));font-weight:700;border:calc(0.7 * var(--u)) solid transparent}
  #tarjNo{background:#3a1d24;color:#ffb4b4;border-color:#7a2b3a !important}
  #tarjSi{background:#f0c95c;color:#1B2145}
  /* 🫧 EL RABITO: dos bolitas que van menguando hacia su boca, como en Apex — no un pico */
  #globo::before,#globo::after{content:"";position:absolute;
         background:linear-gradient(180deg,#1B2145 0%,#171d3c 100%);
         border:calc(0.9 * var(--u)) solid #f0c95c;border-radius:50%;pointer-events:none;
         box-shadow:0 2px 5px rgba(0,0,0,.35)}
  #globo::before{width:calc(4.6 * var(--u));height:calc(4.6 * var(--u));bottom:calc(-3 * var(--u))}
  #globo::after{width:calc(2.9 * var(--u));height:calc(2.9 * var(--u));bottom:calc(-7.5 * var(--u))}
  body[data-lado="der"] #globo::before{right:calc(7 * var(--u))}
  body[data-lado="der"] #globo::after{right:calc(2.6 * var(--u))}
  body[data-lado="izq"] #globo::before{left:calc(7 * var(--u))}
  body[data-lado="izq"] #globo::after{left:calc(2.6 * var(--u))}
  /* ✨ EL REBOTITO DE CÓMIC, el MISMO de dentro de Apex.
     Rey: "cuando va a salir la nube hace un gesto extraño, como que sale y entra, es feo".
     El de antes subía 6px y encogía a la vez con un `ease-out`, y al aplicarse sobre un
     elemento que además cambiaba de `display` se leía como un tirón de ida y vuelta.
     Éste crece de 0.8 a 1.06 y se asienta en 1: sale una vez, y se queda. */
  @keyframes robGloboPop{0%{opacity:0;transform:translateY(calc(2 * var(--u))) scale(.8)}
                         60%{transform:translateY(0) scale(1.06)}
                         100%{opacity:1;transform:none}}
  /* 🌬️ Y AL IRSE, QUE SE VAYA — no que desaparezca de golpe.
     Rey: "no un parche pegado que entra y sale genéricamente". Antes la nubecita se
     quitaba con un `display:none` seco y en el mismo instante la ventana se encogía: dos
     cortes a la vez, que es exactamente lo que se lee como un parche. Ahora se desinfla
     hacia su boca —de donde salió— y solo cuando ha terminado se encoge la ventana. */
  #globo.va{animation:robGloboIr .22s ease-in both}
  @keyframes robGloboIr{0%{opacity:1;transform:none}
                        100%{opacity:0;transform:translateY(calc(1 * var(--u))) scale(.86)}}
  /* la nubecita se mide ANTES de enseñarse: ocupa su sitio pero todavía no se ve, así
     Android puede agrandar la ventana y solo entonces sale. Sin esto, Rey vería la
     nubecita cortada durante un instante y luego saltando a su sitio. */
  /* 📏 v7.72 — AL MEDIR, LA NUBECITA SE SUELTA DEL BORDE. Era una pescadilla que se mordía la
     cola: se medía DENTRO de la ventana de reposo, pegada a la derecha, así que sólo podía
     medir el hueco que quedaba a su izquierda (unos 50 px). Con esa medida se pedía una ventana
     pequeña, y en esa ventana pequeña la frase volvía a partirse en renglones cortos: la
     columna que fotografió Rey. Midiéndola suelta y con su ancho máximo real (652), se pide la
     ventana que de verdad necesita — y entonces la frase entra en tres renglones. */
  #globo.midiendo{display:block;visibility:hidden;animation:none;
                  left:0 !important;right:auto !important;max-width:var(--globo-max) !important}

  /* un punto discreto que indica que está de guardia (nunca dormido) */
  #pulso{position:fixed;bottom:calc(2 * var(--u));width:calc(1.6 * var(--u));height:calc(1.6 * var(--u));border-radius:50%;
         background:#4fe0c0;box-shadow:0 0 calc(1.8 * var(--u)) #4fe0c0;opacity:.85;
         animation:latido 2.8s ease-in-out infinite}
  body[data-lado="der"] #pulso{right:calc(var(--rob-hueco) + calc(1 * var(--u)))}
  body[data-lado="izq"] #pulso{left:calc(var(--rob-hueco) + calc(1 * var(--u)))}
  @keyframes latido{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}
</style>
</head>
<body data-lado="der">
  <div id="globo"></div>
  <div id="pulso"></div>
  <div id="robSombra"></div>
  <div id="robCuerpo"></div>

<script src="situaciones.js"></script>
<script src="frases-celebres.js"></script>   <!-- 🗣️ las citas de cada 30 min (v7.79) -->
<script src="roberto.js"></script>
<script>
(function(){
  "use strict";
  var GESTO_FONDO = "espera";   /* 🚫 REGLA DE REY: Roberto NUNCA aparece durmiendo */
  var cuerpo = document.getElementById("robCuerpo");
  var globo  = document.getElementById("globo");
  var tVuelta = null;

  /* ══════════════════════════════════════════════════════════════════════════
     📏 LA MEDIDA — v7.20: LA VENTANA SE ADAPTA A LA FRASE, NO LA FRASE A LA VENTANA
     ═════════════════════════════════════════════════════════════════════════
     Rey (03-09, con foto): "mira cómo corta la nube… la nube debe adaptarse al mensaje sin
     romperse, lo más natural posible, no un parche pegado que entra y sale genéricamente".
     Aquí está la mitad de la página de ese arreglo (la otra mitad la pone Android):
       1. se CONGELA la unidad `--u` con la ventana en reposo, para que crecer la ventana
          no agrande a Roberto;

      return JSON.stringify({
        vivo: !!svg,
        vw: Math.round(innerWidth), vh: Math.round(innerHeight),
        cx: Math.round(r.left), cy: Math.round(r.top),
        cw: Math.round(r.width), ch: Math.round(r.height),
        sw: Math.round(rs.width), sh: Math.round(rs.height),
        dentro: !!(svg && rs.width > 4 && rs.height > 4 &&
                   rs.right > 0 && rs.left < innerWidth && rs.bottom > 0 && rs.top < innerHeight),
        lado: document.body.dataset.lado || ""
      });
    }catch(e){ return JSON.stringify({ vivo:false, error:String(e && e.message) }); }
  };
  console.log("BURBUJA-LISTA " + (window.burbujaViva() ? "1" : "0"));
})();
</script>
