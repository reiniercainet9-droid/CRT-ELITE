<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roberto flotando</title>
<!--
  🫧 ROBERTO SOBRE LAS DEMÁS APLICACIONES  (paso 2 del plan de Rey)
  ---------------------------------------------------------------------------
  Esta página NO es una pantalla de Apex: es lo que Android dibuja ENCIMA de
  cualquier otra aplicación, dentro de una ventana flotante. Por eso el fondo
  es transparente y no hay nada más que Roberto.

  LO IMPORTANTE: usa EL MISMO roberto.js que Apex. No hay un "Roberto de la
  burbuja" distinto — es el mismo ser, los mismos 34 gestos, la misma cara.
  Regla sellada por Rey: "Roberto y su cuerpo son UNO SOLO".

  Android le habla llamando a estas funciones:
     burbujaGesto("celebra")            → cambia de gesto
     burbujaDecir("texto", "gesto")     → saca la nubecita y mueve la boca
     burbujaCallar()                    → cierra la nubecita
     burbujaLado("izq" | "der")         → se coloca según el borde donde esté
  Y ella le contesta por la consola (Android lee esos mensajes).
-->
<style>
  /* ⚠️ EL FALLO DEL 31-08 ESTABA AQUÍ (Rey: "sigue siendo una foto", tres veces).
     El parte que mandó la burbuja lo cantó: vivo:true, cy:-152 = -(150+2).
     Roberto SÍ se dibujaba… 152 px por encima del borde. ¿Por qué? El body llevaba
     height:100% pero el <html> NO tenía altura, así que el body medía CERO de alto y
     un "bottom:2px" lanzaba a Roberto hacia arriba, fuera de la ventana.
     Dos seguros para que no vuelva a pasar:
       1) html y body con altura de verdad;
       2) todo colocado con position:FIXED y en unidades de la ventana (vh), que se
          miden contra la ventana misma y no contra el body. Así da igual lo que le
          pase al body: Roberto siempre cae donde se ve. */
  html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden;
            -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{width:100%;min-height:100%;position:relative;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  /* Medidas en vh: la ventana solo se ensancha para la nubecita, nunca cambia de alto,
     así que Roberto conserva su tamaño y no depende de píxeles ni de la densidad del
     teléfono (en el moto g54 un píxel de la página era un píxel de pantalla y Roberto
     salía a un tercio de su tamaño). 0.571 es su proporción real (264/462). */
  /* 📏 v7.20 — LA UNIDAD CONGELADA, Y POR QUÉ HIZO FALTA.
     Rey (03-09, con foto): "mira cómo corta la nube, y creo que la nube es fija, no
     adaptativa al mensaje; la nube debe adaptarse al mensaje sin romperse, lo más natural
     posible… no un parche pegado que entra y sale genéricamente".
     TENÍA RAZÓN Y LA CAUSA ERA DE RAÍZ: la ventana flotante medía 231 puntos de ALTO SIEMPRE
     —solo cambiaba de ancho, y de dos maneras: estrecha o ancha—, mientras que la nubecita
     crece hacia ARRIBA desde la boca de Roberto. Con tres líneas cabía raspando; con cuatro
     se salía por el techo de la VENTANA y Android la cortaba. No la cortaba el CSS: la
     cortaba el marco. Por eso se veía como un recorte pegado.
     PARA QUE LA VENTANA PUEDA CRECER hay que resolver antes una trampa: aquí todo se medía
     en `vh`, que es un porcentaje de la ALTURA DE LA VENTANA. Si la ventana crece, `vh`
     crece — y Roberto se haría gigante cada vez que dijera algo largo.
     Así que la unidad se CONGELA al arrancar: `--u` vale lo que valía 1vh con la ventana en
     su tamaño de reposo, y ya no se mueve. A partir de ahí la ventana puede crecer lo que
     necesite la frase sin que Roberto ni su nubecita cambien un pelo de tamaño.
     El valor de aquí abajo es solo el de emergencia (si el guion no llegara a correr, todo
     se comporta como antes en vez de quedarse en blanco). */
  :root{ --u:1vh; --globo-max:52vw;
         --rob-alto:calc(94 * var(--u)); --rob-ancho:calc(calc(94 * var(--u)) * 0.571); }

  /* 🧍 el cuerpo: pegado al borde donde Rey lo haya dejado */
  #robCuerpo{position:fixed;bottom:calc(1 * var(--u));width:var(--rob-ancho);height:var(--rob-alto);transition:none}
  body[data-lado="der"] #robCuerpo{right:calc(1.5 * var(--u))}
  body[data-lado="izq"] #robCuerpo{left:calc(1.5 * var(--u))}
  /* que se despegue del fondo de cualquier app, clara u oscura */
  #robCuerpo .rob-svg{filter:drop-shadow(0 2px 5px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(240,201,92,.28))}

  /* 💬 la nubecita: SIEMPRE al lado contrario del cuerpo, para no taparlo */
  /* 💬 LA NUBECITA — v7.13, CALCADA A LA DE DENTRO DE APEX
     ─────────────────────────────────────────────────────────────────────────────────
     Rey (02-09), con las dos delante en una captura: "la del de afuera es fea, debe quedar
     EXACTAMENTE igual que la de adentro: los bordes definidos, redondeados, los circulitos
     del rabito a la medida de la cabeza apuntando a la boca, no a los pies".
     Tenía toda la razón. Aquí había un pico triangular a la altura de los PIES y unas
     esquinas redondeadas por igual; dentro de Apex hay una esquina viva abajo (la que
     "sale" de él), DOS BOLITAS por rabito, y sale a la altura de su BOCA.
     ⚠️ ESTA ES LA COPIA, Y EL ORIGINAL ES `.rob-globo` DE index.html. No se pueden
     compartir literalmente porque viven en mundos distintos —allí son píxeles de página y
     aquí vh de una ventana de 132 dp—, pero el ASPECTO debe ser el mismo. Hay un banco
     (`test-nube-igual`) que compara las dos y salta si se separan: sin él, esto se vuelve
     la quinta lista de caras del proyecto.
     ───────────────────────────────────────────────────────────────────────────────── */
  /* 📏 v7.20 — `border-box` para que el tope de ancho signifique LO QUE MIDE LA NUBECITA
     ENTERA, con su borde y su relleno dentro. Sin esto el tope se refería solo al texto y
     la nubecita acababa 33 px más ancha de lo que se había calculado — justo lo suficiente
     para no caber en la pantalla junto al cuerpo. */
  #globo{position:fixed;max-width:var(--globo-max);box-sizing:border-box;display:none;
         overflow-wrap:break-word;
         background:#1B2145;color:#f4efe2;
         border:calc(0.9 * var(--u)) solid #f0c95c;
         /* la esquina de abajo VIVA, del lado por el que sale: igual que dentro de Apex */
         border-radius:calc(9 * var(--u)) calc(9 * var(--u)) calc(9 * var(--u)) calc(3.5 * var(--u));
         padding:calc(3.5 * var(--u)) calc(5 * var(--u));font-size:calc(7.2 * var(--u));line-height:1.28;font-weight:600;
         box-shadow:0 8px 24px rgba(0,0,0,.5)}
  /* 🎈 A LA ALTURA DE SU BOCA, NO DE SUS PIES. Su cuerpo mide 94vh desde 1vh del suelo, y
     la boca le cae al 47% de arriba — o sea a ~51vh del suelo. El rabito CUELGA de la nube
     y baja 7,5vh, así que la nube se pone a 58vh: la bolita pequeña muere justo en su boca.
     (Con 51vh el rabito le quedaba por el pecho — se ve, y se ve mal.) */
  body[data-lado="der"] #globo{right:calc(var(--rob-ancho) + calc(2 * var(--u))); bottom:calc(58 * var(--u))}
  body[data-lado="izq"] #globo{left:calc(var(--rob-ancho) + calc(2 * var(--u)));  bottom:calc(58 * var(--u))}
  #globo.hay{display:block; animation:robGloboPop .34s cubic-bezier(.34,1.56,.64,1) both}
  #globo b{color:#f0c95c;display:block;font-size:calc(6 * var(--u));letter-spacing:.3px;margin-bottom:calc(.4 * var(--u))}
  /* 🫧 EL RABITO: dos bolitas que van menguando hacia su boca, como en Apex — no un pico */
  #globo::before,#globo::after{content:"";position:absolute;background:#1B2145;
         border:calc(0.9 * var(--u)) solid #f0c95c;border-radius:50%;pointer-events:none}
  #globo::before{width:calc(4.6 * var(--u));height:calc(4.6 * var(--u));bottom:calc(-3 * var(--u))}
  #globo::after{width:calc(2.9 * var(--u));height:calc(2.9 * var(--u));bottom:calc(-7.5 * var(--u))}
  body[data-lado="der"] #globo::before{right:calc(7 * var(--u))}
  body[data-lado="der"] #globo::after{right:calc(2.6 * var(--u))}
  body[data-lado="izq"] #globo::before{left:calc(7 * var(--u))}
  body[data-lado="izq"] #globo::after{left:calc(2.6 * var(--u))}
  /* ✨ EL REBOTITO DE CÓMIC, el MISMO de dentro de Apex.
     Rey: "cuando va a salir la nube hace un gesto extraño, como que sale y entra, es feo".
     El de antes subía 6px y encogía a la vez con un `ease-out`, y al aplicarse sobre un
     elemento que además cambiaba de `display` se leía como un tirón de ida y vuelta.
     Éste crece de 0.8 a 1.06 y se asienta en 1: sale una vez, y se queda. */
  @keyframes robGloboPop{0%{opacity:0;transform:translateY(calc(2 * var(--u))) scale(.8)}
                         60%{transform:translateY(0) scale(1.06)}
                         100%{opacity:1;transform:none}}
  /* 🌬️ Y AL IRSE, QUE SE VAYA — no que desaparezca de golpe.
     Rey: "no un parche pegado que entra y sale genéricamente". Antes la nubecita se
     quitaba con un `display:none` seco y en el mismo instante la ventana se encogía: dos
     cortes a la vez, que es exactamente lo que se lee como un parche. Ahora se desinfla
     hacia su boca —de donde salió— y solo cuando ha terminado se encoge la ventana. */
  #globo.va{animation:robGloboIr .22s ease-in both}
  @keyframes robGloboIr{0%{opacity:1;transform:none}
                        100%{opacity:0;transform:translateY(calc(1 * var(--u))) scale(.86)}}
  /* la nubecita se mide ANTES de enseñarse: ocupa su sitio pero todavía no se ve, así
     Android puede agrandar la ventana y solo entonces sale. Sin esto, Rey vería la
     nubecita cortada durante un instante y luego saltando a su sitio. */
  #globo.midiendo{display:block;visibility:hidden;animation:none}

  /* un punto discreto que indica que está de guardia (nunca dormido) */
  #pulso{position:fixed;bottom:calc(2 * var(--u));width:calc(1.6 * var(--u));height:calc(1.6 * var(--u));border-radius:50%;
         background:#4fe0c0;box-shadow:0 0 calc(1.8 * var(--u)) #4fe0c0;opacity:.85;
         animation:latido 2.8s ease-in-out infinite}
  body[data-lado="der"] #pulso{right:calc(var(--rob-ancho) + calc(1 * var(--u)))}
  body[data-lado="izq"] #pulso{left:calc(var(--rob-ancho) + calc(1 * var(--u)))}
  @keyframes latido{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}
</style>
</head>
<body data-lado="der">
  <div id="globo"></div>
  <div id="pulso"></div>
  <div id="robCuerpo"></div>

<script src="situaciones.js"></script>
<script src="roberto.js"></script>
<script>
(function(){
  "use strict";
  var GESTO_FONDO = "espera";   /* 🚫 REGLA DE REY: Roberto NUNCA aparece durmiendo */
  var cuerpo = document.getElementById("robCuerpo");
  var globo  = document.getElementById("globo");
  var tVuelta = null;

  /* ══════════════════════════════════════════════════════════════════════════
     📏 LA MEDIDA — v7.20: LA VENTANA SE ADAPTA A LA FRASE, NO LA FRASE A LA VENTANA
     ═════════════════════════════════════════════════════════════════════════
     Rey (03-09, con foto): "mira cómo corta la nube… la nube debe adaptarse al mensaje sin
     romperse, lo más natural posible, no un parche pegado que entra y sale genéricamente".
     Aquí está la mitad de la página de ese arreglo (la otra mitad la pone Android):
       1. se CONGELA la unidad `--u` con la ventana en reposo, para que crecer la ventana
          no agrande a Roberto;
       2. se pone la frase con la nubecita puesta pero INVISIBLE, y se MIDE lo que ocupa;
       3. se le pide a Android por la consola el tamaño exacto que hace falta;
       4. cuando la ventana ya es de ese tamaño, la nubecita SALE con su rebotito.
     Así nunca se ve cortada, ni se ve saltar. */
  var BASE = { alto: 0, ancho: 0, u: 0 };
  var esperandoSitio = null;      /* lo que hay que hacer en cuanto la ventana crezca */

  function congelarUnidad(){
    var h = window.innerHeight || 0, w = window.innerWidth || 0;
    if (h < 40) return false;     /* aún no la ha medido Android: se reintenta */
    BASE.alto = h; BASE.ancho = w; BASE.u = h / 100;
    var raiz = document.documentElement;
    raiz.style.setProperty("--u", BASE.u + "px");
    /* El ancho máximo de la nubecita se mide contra la PANTALLA, no contra la ventana: la
       ventana en reposo solo mide el cuerpo, y midiéndose contra ella la nubecita saldría
       diminuta (es la "raya vertical" que Rey vio en su día). Se le deja su sitio al cuerpo
       y un margen, para que nunca llegue a tocar el borde del teléfono.
       Gracias al `border-box` de arriba, este número es la nubecita ENTERA: borde y relleno
       incluidos. Antes se refería solo al texto y se pasaba 33 px de lo calculado. */
    var pantalla = (window.screen && window.screen.width) ? window.screen.width : (w * 3);
    var cuerpoAncho = BASE.alto * 0.94 * 0.571;
    var max = Math.max(BASE.u * 45, pantalla - cuerpoAncho - BASE.u * 8);
    raiz.style.setProperty("--globo-max", Math.round(max) + "px");
    return true;
  }
  (function intentar(n){
    if (congelarUnidad()) return;
    if (n > 0) setTimeout(function(){ intentar(n - 1); }, 60);
    else console.log("BURBUJA-ERROR no pude medir la ventana: la nubecita irá a ojo");
  })(20);

  /* Android avisa cuando la ventana vuelve a su tamaño de reposo (por ejemplo al girar el
     teléfono): entonces —y solo entonces— se vuelve a congelar la unidad. */
  window.burbujaRemedir = function(){ congelarUnidad(); };

  /* Lo que hace falta de ALTO para que la nubecita quepa entera: desde el suelo de la
     ventana hasta su borde de arriba, más un respiro. Y de ANCHO: el cuerpo, la nubecita
     y la separación entre los dos. Se mide de verdad, no se estima. */
  function pedirSitio(luego){
    var pedidoAlto = BASE.alto, pedidoAncho = BASE.ancho;
    try {
      var r = globo.getBoundingClientRect();
      var suelo = window.innerHeight;
      /* el rabito cuelga por debajo de la nube: entra en la cuenta */
      var rabito = BASE.u * 8;
      pedidoAlto = Math.ceil((suelo - r.top) + BASE.u * 4);
      pedidoAncho = Math.ceil(r.width + BASE.alto * 0.94 * 0.571 + BASE.u * 5);
      if (r.bottom + rabito > suelo) pedidoAlto += Math.ceil(r.bottom + rabito - suelo);
      if (pedidoAlto < BASE.alto) pedidoAlto = BASE.alto;
      if (pedidoAncho < BASE.ancho) pedidoAncho = BASE.ancho;
    } catch(_){}
    esperandoSitio = luego;
    /* ⚠️ SE PIDE EN PROPORCIÓN, NO EN PÍXELES, Y ES A PROPÓSITO.
       Esta página mide en píxeles de CSS y la ventana de Android en píxeles de pantalla, y
       entre los dos hay un factor de densidad que cambia con cada teléfono. Traducirlo aquí
       sería adivinar. Diciendo "necesito 2,4 veces el ancho de reposo y 1,7 veces el alto",
       Android multiplica por SU propia medida de reposo, que la conoce exacta. Sin
       conversiones y sin suposiciones. */
    var rAncho = Math.max(1, pedidoAncho / BASE.ancho);
    var rAlto  = Math.max(1, pedidoAlto  / BASE.alto);
    try { console.log("BURBUJA-CAJA " + rAncho.toFixed(3) + " " + rAlto.toFixed(3)); } catch(_){}
    /* 🛟 SEGURO: si el mensaje no llegara o Android no pudiera crecer, la nubecita SALE
       IGUAL a los 260 ms. Vale más verla un poco justa que no verla nunca. */
    setTimeout(function(){ if (esperandoSitio) { var f = esperandoSitio; esperandoSitio = null; f(); } }, 260);
  }
  /* Android contesta llamando aquí cuando la ventana ya tiene el tamaño pedido */
  window.burbujaHaySitio = function(){
    if (!esperandoSitio) return;
    var f = esperandoSitio; esperandoSitio = null; f();
  };

  /* Si roberto.js no cargara, esta página sería un cuadro TRANSPARENTE: Rey no vería
     nada y parecería que la burbuja no arrancó. Por eso se dice en voz alta — Android
     lee estos mensajes y Apex se los enseña a Rey en el panel. */
  try {
    if (typeof Roberto === "undefined") throw new Error("no cargó roberto.js (el cuerpo de Roberto)");
    Roberto.montar(cuerpo, { tam: "cuerpo", emo: GESTO_FONDO });
    document.documentElement.classList.add("rob-anim-on");  /* siempre animado */
    /* 👔 v7.12 — SE VISTE COMO TOCA, TAMBIÉN AQUÍ. Antes el Roberto flotante salía siempre
       con la ropa por defecto: de traje a las once de la noche de un domingo. Su armario
       decide solo por la hora de Nueva York, y esa decisión vive en roberto.js —o sea, es
       SUYA y es la misma esté donde esté, que es justo la ley que puso Rey. */
    try { Roberto.vestirSolo(); } catch (_) {}
    if (!document.querySelector("#robCuerpo .rob-svg")) throw new Error("Roberto no llegó a dibujarse");
  } catch (e) { console.log("BURBUJA-ERROR " + e.message); }

  function gesto(g){
    try { if (Roberto.emociones[g]) Roberto.poner(g); } catch(_){}
  }

  window.burbujaGesto = function(g){ gesto(g); };

  window.burbujaLado = function(lado){
    document.body.dataset.lado = (lado === "izq") ? "izq" : "der";
  };

  /* ══════════════════════════════════════════════════════════════════════════
     📩 UN AVISO DEL SISTEMA, RESUMIDO COMO DENTRO DE APEX — v7.15
     ═════════════════════════════════════════════════════════════════════════
     Rey (02-09): "saltó un aviso de la noche antes de dormir y la nube salió
     CORTADA A LA MITAD, con lo que decía la alarma".
     LA CAUSA: al cuerpo flotante le llegaba el aviso ENTERO, recortado a 120
     letras. Dentro de Apex eso no pasa porque ahí la nubecita enseña la FRASE
     CORTA de acción que decide `robSitua` ("no entres", "zona confirmada"…),
     no el texto del aviso. Fuera se enseñaba el discurso, y en una ventana de
     231 puntos de alto un párrafo de seis líneas no cabe: se sale por arriba.
     Ahora se usa la MISMA `robSitua` de siempre —viaja pegada en esta página—
     así que dentro y fuera dicen exactamente lo mismo. */
  window.burbujaAviso = function(titulo, cuerpo, kind){
    var frase = "", g = "";
    try {
      if (typeof robSitua === "function") {
        var s = robSitua(titulo || "", cuerpo || "", kind || "");
        if (s) { frase = s.frase || ""; g = s.gesto || ""; }
      }
    } catch(_){}
    /* si por lo que sea no hubiera frase corta, se usa el título, que él ya escribió corto */
    if (!frase) frase = String(titulo || cuerpo || "").replace(/\s+/g, " ").trim();
    /* 🗣️ ESTO SÍ SE DICE EN VOZ ALTA: es una alarma del mercado o un aviso que Rey se
       programó. Es lo ÚNICO que suena — ver la regla en burbujaDecir. */
    window.burbujaDecir(frase, g, true);
  };

  /* ══════════════════════════════════════════════════════════════════════════
     🔇 CUÁNDO SUENA Y CUÁNDO NO — v7.16, LEY DE REY
     ═════════════════════════════════════════════════════════════════════════
     Rey (03-09), y lo vio venir antes de que le explotara en la cara: "solo los
     avisos programados y las alarmas del mercado. Cuando no hay nada de eso, no,
     porque si no va a estar sonando todo el tiempo… puede mantener los gestos y
     la nube, pero si no es de esas cosas no habla."
     TENÍA TODA LA RAZÓN Y ERA UN FALLO MÍO DE ANOCHE: al darle voz al cuerpo
     flotante se la di a TODO lo que dice, y su vida de fondo saca una frase cada
     dos gestos — o sea que habría estado hablándole cada 24-56 segundos, todo el
     día, encima de cualquier aplicación. Insoportable.
     LA REGLA, ahora en el código: el tercer parámetro `hablar` es FALSO por
     defecto. Su vida de fondo sigue igual de viva —gestos, nubecita, frases— pero
     MUDA. Solo suenan las alarmas del mercado y los avisos que él se programó,
     que es lo que pidió. Y encima de eso sigue mandando su interruptor de siempre
     (🔊 Que Roberto me hable): si lo apaga, no suena ni eso. */
  window.burbujaDecir = function(texto, g, hablar){
    texto = String(texto || "").trim();
    if (!texto) return;
    /* 🛟 SEGURO DE ÚLTIMA HORA: una nubecita no es una carta. Aunque alguien mande un
       texto larguísimo por otro camino, aquí se corta a lo que se puede LEER de un
       vistazo — que es para lo que sirve.
       📏 v7.20: el tope sube de 95 a 140 porque la ventana ya crece con la frase, así que
       lo que antes no CABÍA ahora sí cabe. Sigue habiendo tope: el límite ya no lo pone el
       marco, lo pone lo que un ojo lee de una pasada. */
    if (texto.length > 140) {
      var c = texto.lastIndexOf(" ", 140);
      texto = texto.slice(0, c > 90 ? c : 140).trim() + "…";
    }
    /* 💬 v7.13 — PEDIR SITIO ANTES DE HABLAR.
       Rey: "hay un error en la nube, no se ve, solo sale una línea recta". La ventana
       flotante mide solo lo que el cuerpo y hay que agrandarla para que quepa la nubecita.
       Ese ensanche lo pedía Java cuando él mandaba el aviso — pero la vida de fondo llama a
       esta función desde AQUÍ DENTRO, y entonces nadie ensanchaba nada: la nubecita quedaba
       aplastada contra el borde, que es la raya que vio Rey.
       📏 v7.20 — Y AHORA SE PIDE EL SITIO EXACTO, NO "ANCHA/ESTRECHA".
       Rey, con la foto de la nubecita cortada: "la nube debe adaptarse al mensaje sin
       romperse". El orden importa y es lo que hace que se vea natural:
         1) se pone la frase con la nubecita PUESTA PERO INVISIBLE, para poder medirla;
         2) se le pide a Android el alto y el ancho que de verdad ocupa;
         3) SOLO cuando la ventana ya es así de grande, sale con su rebotito.
       Al revés —enseñarla y luego agrandar— Rey vería medio segundo de nubecita cortada
       pegando un salto, que es justo el "parche pegado" del que se quejó. */
    globo.classList.remove("va");
    globo.textContent = texto;
    globo.classList.add("midiendo");
    gesto(g || Roberto.gestoDe(texto));
    pedirSitio(function(){
      globo.classList.remove("midiendo");
      globo.classList.add("hay");
    });
    /* 🗣️ v7.15 — LA BOCA SE MUEVE AQUÍ; LA VOZ LA PONE ANDROID, Y LA DECIDE REY.
       `mudo:true` NO es "que se calle": es que esta página no reproduce audio — la voz la
       pone el motor de Android desde el servicio, que suena mucho mejor y no depende de que
       el navegador interno esté despierto. Aquí solo se le mueve la boca al ritmo.
       ⚠️ Y OJO CON LA LEY DE REY (02-09): "si yo necesito que no me interrumpa, ya lo
       decidiré yo". El interruptor del silencio es SUYO y vive en los ajustes de Apex
       (🔊 Que Roberto me hable); esta línea no decide nada, solo reparte el trabajo. */
    try { Roberto.hablar(texto, { mudo: true }); } catch(_){}
    /* 🔇 y SOLO si esto es una alarma o un aviso programado se le pide a Android que lo
       DIGA. Su vida de fondo pasa por aquí sin `hablar`, así que mueve la boca y saca su
       nubecita pero no suena — que es exactamente lo que pidió Rey. */
    if (hablar) { try { console.log("BURBUJA-VOZ " + texto); } catch(_){} }
    clearTimeout(tVuelta);
    /* vuelve solo a estar de guardia: no se queda con cara de nada */
    tVuelta = setTimeout(window.burbujaCallar, 9000);
  };

  window.burbujaCallar = function(){
    clearTimeout(tVuelta);
    esperandoSitio = null;
    try { Roberto.callar(); } catch(_){}
    gesto(GESTO_FONDO);
    if (!globo.classList.contains("hay") && !globo.classList.contains("midiendo")) return;
    /* 🌬️ v7.20 — QUE SE VAYA, NO QUE DESAPAREZCA.
       Antes esto era un corte seco (quitar la nubecita) y, en el mismo instante, la ventana
       encogiendo: dos tijeretazos a la vez. Rey lo llamó por su nombre — "un parche pegado
       que entra y sale genéricamente". Ahora la nubecita se desinfla hacia su boca, que es
       de donde salió, y la ventana solo se devuelve CUANDO YA NO HAY NADA QUE ENSEÑAR. */
    globo.classList.remove("hay");
    globo.classList.remove("midiendo");
    globo.classList.add("va");
    setTimeout(function(){
      globo.classList.remove("va");
      /* y se devuelve el sitio: si la ventana se quedara grande, se comería los toques de
         la aplicación que Rey tenga debajo en una franja donde ya no hay nada que ver */
      try { console.log("BURBUJA-CAJA 1 1"); } catch(_){}
    }, 230);
  };

  /* ══════════════════════════════════════════════════════════════════════════
     🎭 SU VIDA DE FONDO, TAMBIÉN AQUÍ FUERA — v7.12
     ═════════════════════════════════════════════════════════════════════════
     Rey lo dejó por ley (02-09): "las funciones de él con su cuerpo deben ser
     las mismas esté donde esté… así, esté donde esté, no me pierdo ninguna
     señal ni gesto, ni su nubecita diciéndome las frases cortas".
     Hasta hoy, el Roberto que flota encima de otras aplicaciones se quedaba
     CLAVADO en un gesto hasta que llegaba un aviso. Tenía el mismo cuerpo y los
     mismos 36 gestos, pero no tenía de dónde sacar QUÉ hacer cuando no pasa
     nada — esa tabla vivía solo en app.js.
     Ahora `ROB_VIDA` está en situaciones.js, la fuente que ya comparten la app y
     el vigilante, y esta ventana bebe de LA MISMA. No es una copia: si mañana se
     le añade un gesto a la killzone, le sale aquí igual.
     ⚠️ Y ojo con la hora: aquí NO se puede preguntar por la killzone como en
     Apex (eso lo sabe la app, no esta ventana), así que se elige la situación
     por lo que SÍ se sabe desde fuera — el día y la hora de Nueva York. */
  var vidaT = null, vidaUlt = "", vidaFrase = 0;

  function situacionAhora(){
    try{
      var f = new Date();
      var ny = new Date(f.toLocaleString("en-US", { timeZone: "America/New_York" }));
      var d = ny.getDay(), h = ny.getHours() * 60 + ny.getMinutes();
      /* ⏰ Las horas son LAS SUYAS, no unas cualesquiera: su ventana operativa configurada
         en el Ejecutor es 01:00–13:00 NY y su killzone Pre-NY es 7:30–9:30. Si aquí se
         pusieran otras, el Roberto flotante haría gestos de "espera" mientras su propio
         sistema está operando, o al revés. */
      if (d === 0 || d === 6) return "finde";
      if (h >= 450 && h < 570) return "killzone";   /* 7:30–9:30 NY, su mejor ventana */
      if (h >= 420 && h < 450) return "cerca";      /* la media hora de antes */
      if (h >= 60 && h < 780) return "espera";      /* 1:00–13:00 NY: su ventana operativa */
      return "madrugada";                            /* fuera de su horario */
    }catch(_){ return "espera"; }
  }

  function unGesto(){
    try{
      if (globo.classList.contains("hay")) return;   /* ya está diciendo algo: no se pisa */
      if (typeof ROB_VIDA === "undefined") return;
      var pack = ROB_VIDA[situacionAhora()] || ROB_VIDA.espera;
      if (!pack || !pack.gestos || !pack.gestos.length) return;
      var posibles = pack.gestos.filter(function(x){ return x !== vidaUlt; });
      var emo = posibles[Math.floor(Math.random() * posibles.length)] || pack.gestos[0];
      vidaUlt = emo;
      gesto(emo);
      /* 1 de cada 2 veces suelta una frase corta, igual que dentro de Apex */
      vidaFrase++;
      if (vidaFrase % 2 === 0 && pack.frases && pack.frases.length){
        window.burbujaDecir(pack.frases[Math.floor(Math.random() * pack.frases.length)], emo);
        return;                       /* la nubecita ya devuelve el gesto de guardia sola */
      }
      /* y vuelve a su cara de guardia: un gesto que se queda puesto es una foto */
      setTimeout(function(){ try{ if(!globo.classList.contains("hay")) gesto(GESTO_FONDO); }catch(_){} },
                 4200 + Math.random() * 1800);
    }catch(_){}
  }

  /* Ritmo irregular A PROPÓSITO: cada 12–28 s parece una persona; cada 20 clavados,
     un reloj. Se reprograma tras cada gesto, nunca con un temporizador que se repita
     (uno que se repite cuelga el navegador de pruebas y deja procesos vivos). */
  function vida(){
    clearTimeout(vidaT);
    vidaT = setTimeout(function(){ unGesto(); vida(); }, 12000 + Math.random() * 16000);
  }
  vida();

  /* Android la para cuando la esconde, para no gastar batería moviendo a nadie */
  window.burbujaVida = function(on){ if(on) vida(); else clearTimeout(vidaT); };

  /* Android comprueba con esto que la página cargó de verdad */
  window.burbujaViva = function(){ return !!document.querySelector("#robCuerpo .rob-svg"); };

  /* 🔎 EL PARTE MÉDICO DE LA BURBUJA (31-08). Rey vio la ventana creada — Apex decía
     "flotando" y era verdad — pero DENTRO no se dibujaba nada. Con esto Android puede
     preguntar qué está pasando de verdad ahí dentro, en vez de que yo adivine:
     si Roberto existe, cuánto mide la ventana por dentro, y si su cuerpo cae DENTRO
     de lo que se ve o se quedó fuera del recorte. */
  window.burbujaInforme = function(){
    try{
      var r = cuerpo.getBoundingClientRect();
      var svg = document.querySelector("#robCuerpo .rob-svg");
      var rs = svg ? svg.getBoundingClientRect() : {left:0,top:0,width:0,height:0,right:0,bottom:0};
      return JSON.stringify({
        vivo: !!svg,
        vw: Math.round(innerWidth), vh: Math.round(innerHeight),
        cx: Math.round(r.left), cy: Math.round(r.top),
        cw: Math.round(r.width), ch: Math.round(r.height),
        sw: Math.round(rs.width), sh: Math.round(rs.height),
        dentro: !!(svg && rs.width > 4 && rs.height > 4 &&
                   rs.right > 0 && rs.left < innerWidth && rs.bottom > 0 && rs.top < innerHeight),
        lado: document.body.dataset.lado || ""
      });
    }catch(e){ return JSON.stringify({ vivo:false, error:String(e && e.message) }); }
  };
  console.log("BURBUJA-LISTA " + (window.burbujaViva() ? "1" : "0"));
})();
</script>
